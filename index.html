function rollChestTier() {
  const tiers = GAME_DATA.gameplay.chest_tiers;
  const keys = Object.keys(tiers);
  const weights = keys.map(k => tiers[k].weight);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for (let i=0; i<keys.length; i++) {
    r -= weights[i];
    if (r <= 0) return keys[i];
  }
  return 'white';
}

function openChest(tier) {
  const chestDef = GAME_DATA.gameplay.chest_tiers[tier];
  if (!chestDef) return;

  // 所有宝箱都存入背包，不自动打开
  addInventoryItem('chest_' + tier, 1);
  addLog(`📦 获得${chestDef.name}，已存入背包`, 'loot');
}

function weightedRandom(pool) {
  const total = pool.reduce((a,b)=>a+b.weight,0);
  let r = Math.random()*total;
  for (const item of pool) {
    r -= item.weight;
    if (r <= 0) return item;
  }
  return pool[pool.length-1];
}

function startFishing() {
  if (G.fishingInProgress) { addLog('⏳ 正在钓鱼...', 'warning'); return; }
  const hasRod = G.equippedRod || hasItem('fishing_rod') || hasItem('wood_rod') || hasItem('iron_rod') || hasItem('crystal_rod');
  if (!hasRod) {
    addLog('❌ 需要钓竿才能钓鱼！', 'warning');
    return;
  }
  // 精力检查
  if ((G.stats.energy || 0) < 2) {
    addLog('❌ 精力不足！（需要2精力）', 'warning');
    return;
  }
  G.stats.energy -= 2;
  renderStatusBar();

  G.fishingInProgress = true;
  // 1-30秒随机钓鱼时间
  const fishTime = (1 + Math.floor(Math.random() * 30)) * 1000;

function determineFishCatch() {
  // Bait quality bonus (v2: use Equipment class)
  let qualityBonus = 0;
  let baitId = null;
  if (G.player) {
    const bait = G.player.equipment.getBait();
    if (bait) {
      baitId = bait.itemId;
      qualityBonus += bait.itemData.quality_bonus || 0;
      qualityBonus += (bait.itemData.tier_bonus || 0) * 0.1; // tier_bonus转为quality_bonus
    }
  } else if (G.equippedBait) {
    baitId = G.equippedBait;
    const baitDef = getItemDef(G.equippedBait);
    if (baitDef) {
      qualityBonus += baitDef.quality_bonus || 0;
      qualityBonus += (baitDef.tier_bonus || 0) * 0.1;
    }
  }

  // 钓鱼天赋加成
  const fishBonus = getTalentEffect('fishSuccessMult', 0);
  const rareFishBonus = getTalentEffect('rareFishBonus', 0);
  qualityBonus += fishBonus + rareFishBonus;

  // Night fishing: rarer fish
  const isNight = !isDaytime();
  let nightBonus = isNight ? 0.15 : 0;

  // Day-based fish variety
  const day = G.day;
  let dayBonus = Math.min(0.1, day * 0.002); // up to +10% at day 50

  const r = Math.random();

  // Night-specific fish
  if (isNight && r < 0.08 + qualityBonus * 0.5) {
    const nightFish = ['moonfish', 'shadow_eel', 'starfish'];
    return {id: nightFish[Math.floor(Math.random()*nightFish.length)], count: 1};
  }

  // Disaster weather bonus: void fish more likely
  if (G.weather === 'void_storm' && r < 0.15) {
    return {id:'void_fish', count: 1};
  }

  // Late-game rare fish
  if (day >= 30 && r < 0.03 + dayBonus) {
    return {id:'legendary_fish', count: 1};
  }

  if (r < 0.35 - qualityBonus - dayBonus) return {id:'common_fish', count: 1+Math.floor(Math.random()*2)};
  if (r < 0.65 - qualityBonus*0.5) return {id:'raw_fish', count: 1+Math.floor(Math.random()*3)};
  if (r < 0.82 - nightBonus) return {id:'rare_fish', count: 1};
  if (r < 0.94) return {id:'legendary_fish', count: 1};
  return {id:'void_fish', count: 1};
}

function gatherResource(type) {
  if ((G.stats.energy || 0) < 4) {
    addLog('❌ 精力不足！（需要4精力）', 'warning');
    return;
  }
  G.stats.energy -= 4;
  renderStatusBar();

  const gatherMult = getTalentMult('gather_mult', 1) * (hasProfession('pioneer') ? 1.2 : 1);
  // 词条采集加成
  const allBonusesForGather = getAllAffixBonuses();
  const affixGatherBonus = 1 + (allBonusesForGather.gatherBonus || 0) / 100;
  const harvestBonus = (combatState && combatState.doubleHarvest ? 2 : 1) * affixGatherBonus;

  // Weather bonuses
  let weatherMult = 1;
  let weatherNote = '';
  if (G.weather === 'rainy') { weatherMult = 1.2; weatherNote = '（雨天+20%）'; }
  if (G.weather === 'stormy') { weatherMult = 0.5; weatherNote = '（暴风雨-50%）'; }
  if (G.weather === 'foggy') { weatherMult = 0.9; weatherNote = '（雾天）'; }

  // Tool durability check (v2: use Equipment class)
  let toolBonus = 0;
  if (G.player) {
    const tool = G.player.equipment.getTool();
    if (tool && !tool.isBroken) {
      toolBonus = tool.itemData.power || 1;
      tool.consumeDurability(1);
      if (tool.isBroken) {
        addLog(`💔 ${tool.name}损坏了！`, 'warning');
        unequipBrokenItems();
      }
      G.player.equipment.syncToLegacy();
    }
  } else if (G.equippedTool && G.toolDurability[G.equippedTool] > 0) {
    const toolDef = getItemDef(G.equippedTool);
    if (toolDef) {
      toolBonus = toolDef.power || 1;
      G.toolDurability[G.equippedTool]--;
      if (G.toolDurability[G.equippedTool] <= 0) {
        addLog(`💔 ${toolDef.name}损坏了！`, 'warning');
        delete G.toolDurability[G.equippedTool];
        G.equippedTool = null;
      }
    }
  }

  // Set activity for decay
  G.currentActivity = 'gathering';

  // Gather water
  if (type === 'water') {
    const hasContainer = hasItem('water_skin') || hasItem('water_bucket') || G.equippedRod;
    if (!hasContainer) {
      addLog('❌ 需要水袋或水桶来装水！', 'warning');
      return;
    }
    const restore = hasItem('water_bucket') ? 35 : 20;
    G.stats.water = Math.min(100, G.stats.water + restore);
    addInventoryItem('freshwater', 1);
    addLog(`💧 取水成功！饮水+${restore}，获得淡水x1${weatherNote}`, 'good');
    // advanceTime(1); - 时间已改为自然流逝
    return;
  }

  let items = [];
  // 采集天赋加成
  const woodMult = 1 + getTalentEffect('woodMult', 0);
  const mineMult = 1 + getTalentEffect('mineMult', 0);
  const herbMult = 1 + getTalentEffect('herbGatherMult', 0);

  switch(type) {
    case 'wood':
      if (!hasTool('axe')) {
        addLog('❌ 没有斧头无法砍树！请先制作一把斧头。', 'warning');
        return;
      }
      items = [{id:'wood', min:2, max:Math.floor((5+toolBonus)*woodMult)}];
      if (Math.random() < 0.2) items.push({id:'fine_wood', min:1, max:1});
      break;
    case 'stone':
      if (!hasTool('pickaxe')) {
        addLog('❌ 没有镐无法采矿！请先制作一把镐。', 'warning');
        return;
      }
      items = [{id:'stone', min:2, max:Math.floor((4+toolBonus)*mineMult)}];
      if (Math.random() < 0.15) items.push({id:'iron_ore', min:1, max:2});
      if (Math.random() < 0.08) items.push({id:'copper_ore', min:1, max:1});
      break;
    case 'herb':
      items = [{id:'herb', min:1, max:Math.floor(3*herbMult)}];
      if (hasProfession('healer')) items[0].max += 2;
      if (Math.random() < 0.1) items.push({id:'herb_seed', min:1, max:1});
      break;
    case 'fiber':
      // 纤维可以徒手采集
      items = [{id:'fiber', min:2, max:4}];
      break;
    case 'explore':
      exploreIsland();
      return;
  }

  let results = [];
  for (const item of items) {
    let count = Math.floor((item.min + Math.random()*(item.max-item.min+1)) * gatherMult * harvestBonus * weatherMult);
    count = Math.max(1, count);
    addInventoryItem(item.id, count);
    results.push(`${getItemName(item.id)} x${count}`);
  }

  // Rare resource bonus
  if (hasProfession('pioneer') && Math.random() < 0.2) {
    const rare = ['crystal','iron_ore','herb'];
    const rId = rare[Math.floor(Math.random()*rare.length)];
    addInventoryItem(rId, 1);
    results.push(`${getItemName(rId)} x1（稀有发现！）`);
  }

  // 词条稀有发现加成
  const rareChanceBonus = (allBonusesForGather.rareChance || 0) / 100 + (allBonusesForGather.luckBonus || 0) / 100;
  if (rareChanceBonus > 0 && Math.random() < rareChanceBonus) {
    const rare2 = ['crystal','iron_ore','herb','copper_ore'];
    const rId2 = rare2[Math.floor(Math.random()*rare2.length)];
    addInventoryItem(rId2, 1);
    results.push(`${getItemName(rId2)} x1（幸运发现！）`);
  }

  // Crit gather (talent)
  if (getTalentEffect('gather_crit',0) > 0 && Math.random() < getTalentEffect('gather_crit',0)) {
    const bonusId = items[0].id;
    addInventoryItem(bonusId, 2);
    results.push(`${getItemName(bonusId)} x2（暴击采集！）`);
  }

  addLog(`⛏️ 采集获得：${results.join(', ')}${weatherNote}`, 'loot');
  if (combatState) combatState.doubleHarvest = false;
  // advanceTime(1); - 时间已改为自然流逝
}

function exploreIsland() {
  if ((G.stats.energy || 0) < 5) {
    addLog('❌ 精力不足！（需要5精力）', 'warning');
    return;
  }
  G.stats.energy -= 5;
  renderStatusBar();

  // 探索效率天赋
  const exploreMult = 1 + getTalentEffect('exploreEffMult', 0);
  const rareEventBonus = getTalentEffect('rareEventBonus', 0);

  const events = GAME_DATA.events.exploration_events;
  if (!events || events.length === 0) {
    addLog('🔍 探索了一番，没有发现什么特别的。', 'system');
    addExp(Math.floor((5 + Math.floor(Math.random()*5)) * exploreMult));
    return;
  }

  const evt = events[Math.floor(Math.random()*events.length)];

  if (evt.type === 'loot') {
    const loot = [];
    if (evt.rewards) {
      for (const [itemId, range] of Object.entries(evt.rewards)) {
        const count = Math.floor((range[0] + Math.floor(Math.random()*(range[1]-range[0]+1))) * exploreMult);
        addInventoryItem(itemId, count);
        loot.push(`${getItemName(itemId)} x${count}`);
      }
    }
    addLog(`🔍 ${evt.name}：获得 ${loot.join(', ')}`, 'loot');
  } else if (evt.type === 'combat') {
    addLog(`⚔️ ${evt.name}`, 'combat');
    const enemies = [];
    if (evt.enemies) {
      for (const e of evt.enemies) {
        const cdef = getCreatureDef(e.id);
        if (cdef) {
          const cnt = e.count[0] + Math.floor(Math.random()*(e.count[1]-e.count[0]+1));
          for (let i=0; i<cnt; i++) enemies.push({...cdef});
        }
      }
    }
    if (enemies.length > 0) startCombat(enemies);
  } else if (evt.type === 'choice') {
    showChoiceEvent(evt);
  }
}

function initGarden() {
  if (G.garden.length === 0) {
    G.garden = [
      {id:null, timer:0, stage:0},
      {id:null, timer:0, stage:0},
      {id:null, timer:0, stage:0},
      {id:null, timer:0, stage:0},
    ];
  }
}

function plantSeed(plotIndex, seedId) {
  const seedDef = getItemDef(seedId);
  if (!seedDef || seedDef.type !== 'seed') { addLog('❌ 这不是种子！', 'warning'); return; }
  if (!hasItem(seedId)) { addLog('❌ 没有这种种子！', 'warning'); return; }
  if (G.garden[plotIndex].id) { addLog('❌ 这块地已有作物！', 'warning'); return; }

  removeInventoryItem(seedId);
  const growthMult = getTalentMult('growth_speed_mult', 1);
  G.garden[plotIndex] = {
    id: seedDef.harvest_id || seedId.replace('_seed',''),
    timer: Math.floor(seedDef.growth_time * growthMult),
    stage: 0,
    maxStages: seedDef.stages || 4,
    harvestAmount: seedDef.harvest_amount || [2,4],
    seedId: seedId,
  };
  addLog(`🌱 种下了${seedDef.name}！`, 'good');
  renderAll(); // 刷新UI显示种植结果
}

function updateGarden() {
  for (const plot of G.garden) {
    if (plot.id && plot.timer > 0) {
      plot.timer--;
      const progress = 1 - (plot.timer / (plot.maxStages * 3));
      plot.stage = Math.min(plot.maxStages, Math.floor(progress * plot.maxStages));
      if (plot.timer <= 0) {
        plot.stage = plot.maxStages;
      }
    }
  }
}

function harvestGarden(plotIndex) {
  const plot = G.garden[plotIndex];
  if (!plot.id || plot.timer > 0) return;
  const count = plot.harvestAmount[0] + Math.floor(Math.random()*(plot.harvestAmount[1]-plot.harvestAmount[0]+1));
  const gatherMult = getTalentMult('gather_mult', 1);
  const finalCount = Math.max(1, Math.floor(count * gatherMult));
  addInventoryItem(plot.id, finalCount);
  addLog(`🌾 收获${getItemName(plot.id)} x${finalCount}`, 'loot');
  G.garden[plotIndex] = {id:null, timer:0, stage:0};
  renderAll(); // 刷新UI显示收获结果
}

function canBuildBuilding(id) {
  const def = BUILDING_DEFS[id];
  if (!def) return false;
  if (G.buildings[id]) return false;
  if (def.blueprint && !G.blueprints.includes(def.blueprint)) return false;
  if (def.unlock && def.unlock !== 'start' && !G.buildings[def.unlock]) return false;
  for (const [res, need] of Object.entries(def.cost)) {
    if ((G.inventory[res]||0) < need) return false;
  }
  return true;
}

function buildBuilding(id) {
  if (!canBuildBuilding(id)) return;
  const def = BUILDING_DEFS[id];
  for (const [res, need] of Object.entries(def.cost)) {
    removeInventoryItem(res, need);
  }
  G.buildings[id] = true;
  if (def.defense) G.defense += def.defense;
  addLog(`🏗️ 建造了${def.name}！`, 'good');
  renderBuildings();
  renderAll();
}

function getAvailableRecipes() {
  const recipes = [];
  const allRecipes = GAME_DATA.recipes;
  for (const cat of ['tools','weapons','armor','consumables']) {
    for (const r of (allRecipes[cat]||[])) {
      if (r.unlock === 'start' || G.buildings[r.unlock]) {
        recipes.push({...r, category:cat});
      }
    }
  }
  // Add custom recipes
  const customRecipes = getCustomRecipes();
  for (const r of customRecipes) {
    if (r.unlock === 'start' || !r.unlock || G.buildings[r.unlock]) {
      recipes.push(r);
    }
  }
  return recipes;
}

function canCraft(recipe) {
  if (recipe.category === 'consumables' && recipe.id.includes('cooked') && !G.buildings.campfire) return false;
  for (const [res, need] of Object.entries(recipe.ingredients)) {
    if ((G.inventory[res]||0) < need) return false;
  }
  return true;
}

function craftItem(recipe) {
  if (!canCraft(recipe)) {
    addLog('❌ 材料不足！', 'warning');
    return;
  }

  // Smith profession bonus
  let successRate = 1.0;
  if (hasProfession('smith')) successRate += 0.22;

  // Material save from talent
  const materialSave = getTalentEffect('materialSave', 0);

  // Free craft from skill
  if (combatState && combatState.freeCraft) {
    combatState.freeCraft = false;
    addLog('🔨 免费制作！', 'good');
  } else {
    for (const [res, need] of Object.entries(recipe.ingredients)) {
      let actualNeed = need;
      if (hasProfession('smith') && Math.random() < 0.2) actualNeed = Math.max(1, need-1);
      // Talent material save
      if (materialSave > 0 && Math.random() < materialSave) actualNeed = Math.max(1, actualNeed - 1);
      removeInventoryItem(res, actualNeed);
    }
  }

  const amount = recipe.amount || 1;
  addInventoryItem(recipe.result, amount);

  // Generate affixes for equipment
  const resultDef = getItemDef(recipe.result);
  if (resultDef && ['weapon','armor','tool'].includes(resultDef.type)) {
    let grade = resultDef.grade || 'F';
    // 天赋制作品质提升
    const talentQualityUp = getTalentEffect('craftQualityUp', 0);
    const profQualityUp = hasProfession('smith') ? 1 : 0;
    const totalQualityUp = talentQualityUp + profQualityUp;
    if (totalQualityUp > 0) {
      const gradeOrder = ['F','E','D','C','B','A','S','SS','SSS'];
      const currentIdx = gradeOrder.indexOf(grade);
      const newIdx = Math.min(currentIdx + totalQualityUp, gradeOrder.length - 1);
      grade = gradeOrder[newIdx];
      if (grade !== resultDef.grade) {
        addLog(`  ⬆️ 品质提升：${resultDef.grade} → ${grade}`, 'good');
      }
    }

    // 天赋耐久加成
    const durabilityMult = getTalentMult('durabilityMult', 1);
    const baseDurability = resultDef.durability || 0;
    const finalDurability = baseDurability > 0 ? Math.floor(baseDurability * durabilityMult) : 0;

    // Smith profession bonus
    const smithBonus = hasProfession('smith') ? 0.15 : 0;
    const qualityBonus = (combatState && combatState.qualityUp) ? 1 : 0;
    if (combatState) combatState.qualityUp = false;
    const affixes = generateAffixes(recipe.result, grade, smithBonus + qualityBonus*0.3);
    if (affixes.length > 0) {
      storeAffixes(recipe.result, affixes);
      const affixNames = affixes.map(a=>`${a.name}[${AFFIX_TIERS[a.tier].name}]`).join(', ');
      addLog(`  ✦ 词条：${affixNames}`, 'good');
    }

    // 应用耐久加成到物品
    if (finalDurability > 0 && finalDurability !== baseDurability) {
      addLog(`  🔨 耐久：${baseDurability} → ${finalDurability}`, 'good');
      // 存储耐久加成信息
      if (!G.toolDurability) G.toolDurability = {};
      G.toolDurability[recipe.result] = finalDurability;
    }
  }

  addLog(`🔨 制作了${getItemName(recipe.result)} x${amount}！`, 'good');
  renderCrafting();
  renderAll();
}

// ============================================================
function learnProfession(bookId) {
  const def = getItemDef(bookId);
  if (!def) return;
  // 支持 profession_book 和 profession_scroll 两种类型
  const profId = def.profession || def.profession_id;
  if (!profId) return;
  if (G.professions.includes(profId)) {
    addLog(`ℹ️ 你已经学会了${PROFESSIONS[profId]?.name || profId}！`, 'warning');
    return;
  }
  G.professions.push(profId);
  removeInventoryItem(bookId);
  addLog(`📖 学会了新职业：${PROFESSIONS[profId]?.name || profId}（${PROFESSIONS[profId]?.desc || ''}）`, 'good');
  renderInfo();
  renderAll();
}

function learnSkill(bookId) {
  const def = getItemDef(bookId);
  if (!def || def.type !== 'skill_book') return;
  const skillId = def.skill;
  if (G.skills.includes(skillId)) {
    addLog('ℹ️ 你已经学会了这个技能！', 'warning');
    return;
  }
  const skill = SKILLS[skillId];
  if (!skill) return;
  if (!hasSkill(skillId) && !G.professions.includes(skill.profession)) {
    addLog(`❌ 需要${PROFESSIONS[skill.profession].name}职业才能学习此技能！`, 'warning');
    return;
  }
  G.skills.push(skillId);
  removeInventoryItem(bookId);
  addLog(`📕 学会了新技能：${skill.name}（${skill.desc}）`, 'good');
  renderInfo();
}

function hasSkill(id) { return G.skills.includes(id); }

function discardItem(id) {
  const count = G.inventory[id] || 0;
  if (count <= 0) return;
  const def = getItemDef(id);
  const name = def ? def.name : id;
  if (count === 1) {
    removeInventoryItem(id, 1);
    addLog(`🗑️ 丢弃了${name}`, 'system');
  } else {
    // Discard all at once
    removeInventoryItem(id, count);
    addLog(`🗑️ 丢弃了${name} x${count}`, 'system');
  }
  hideModal();
  renderAll();
}

// ============================================================
// USE ITEMS
// ============================================================
function useItem(id) {
  if (!hasItem(id)) return;
  const def = getItemDef(id);
  if (!def) return;

  // Profession books and scrolls
  if (def.type === 'profession_book' || def.type === 'profession_scroll') {
    learnProfession(id);
    return;
  }
  // Skill books
  if (def.type === 'skill_book') {
    learnSkill(id);
    return;
  }
  // Blueprints
  if (def.type === 'blueprint') {
    if (!G.blueprints.includes(id)) {
      G.blueprints.push(id);
    }
    removeInventoryItem(id);
    addLog(`📋 学习了蓝图：${def.name}`, 'good');
    renderBuildings();
    return;
  }
  // Seeds
  if (def.type === 'seed') {
    showPlantModal(id);
    return;
  }
  // Expand voucher
  if (id === 'expand_voucher') {
    G.islandSize += 20;
    removeInventoryItem(id);
    addLog(`🏝️ 空岛扩展至${G.islandSize}x${G.islandSize}！`, 'good');
    renderAll();
    return;
  }
  // Food/consumables
  if (def.type === 'food' || def.type === 'consumable' || def.type === 'potion') {
    if (def.heal) {
      G.stats.hp = Math.min(G.stats.maxHp, G.stats.hp + def.heal);
      addLog(`💚 使用${def.name}，HP+${def.heal}`, 'good');
    }
    if (def.hunger_restore) {
      G.stats.hunger = Math.min(100, G.stats.hunger + def.hunger_restore);
      addLog(`🍖 食用${def.name}，饱食度+${def.hunger_restore}`, 'good');
    }
    if (def.water_restore) {
      G.stats.water = Math.min(100, G.stats.water + def.water_restore);
      addLog(`💧 饮用${def.name}，饮水+${def.water_restore}`, 'good');
    }
    if (def.mana_restore) {
      G.stats.mental = Math.min(100, G.stats.mental + def.mana_restore);
      addLog(`✨ 使用${def.name}，精神+${def.mana_restore}`, 'good');
    }
    removeInventoryItem(id);
    if (id === 'void_fish') { G._ateVoidFish = true; checkAchievements(); }
    renderAll();
    return;
  }
  // v2: Equipment via Equipment class (body-part based)
  if (def.type === 'weapon') {
    if (G.player) {
      const item = new EquipItem(id, def, def.grade, G.toolDurability[id] != null ? G.toolDurability[id] : def.durability);
      // 武器默认装备到主手
      const old = G.player.equipment.equip(item, EquipSlot.LEFT_HAND);
      removeInventoryItem(id);
      if (old) { addInventoryItem(old.itemId); G.toolDurability[old.itemId] = old.durability; }
      G.player.equipment.syncToLegacy();
    } else {
      const old = G.equippedWeapon;
      G.equippedWeapon = id;
      removeInventoryItem(id);
      if (old) addInventoryItem(old);
    }
    addLog(`⚔️ 装备了${def.name}（主手）`, 'system');
    renderInventory();
    return;
  }
  if (def.type === 'armor') {
    const slot = def.slot === 'head' ? EquipSlot.HEAD : EquipSlot.BODY;
    if (G.player) {
      const item = new EquipItem(id, def, def.grade, G.toolDurability[id] != null ? G.toolDurability[id] : def.durability);
      const old = G.player.equipment.equip(item, slot);
      removeInventoryItem(id);
      if (old) { addInventoryItem(old.itemId); G.toolDurability[old.itemId] = old.durability; }
      G.player.equipment.syncToLegacy();
    } else {
      if (def.slot === 'head') {
        const old = G.equippedHead; G.equippedHead = id; removeInventoryItem(id); if (old) addInventoryItem(old);
      } else {
        const old = G.equippedArmor; G.equippedArmor = id; removeInventoryItem(id); if (old) addInventoryItem(old);
      }
    }
    addLog(`🛡️ 装备了${def.name}`, 'system');
    renderInventory();
    return;
  }
  // Tool equip (fishing rod) -> 主手
  if (def.type === 'tool' && def.tool_type === 'fishing') {
    if (G.player) {
      const item = new EquipItem(id, def, def.grade, def.durability);
      const old = G.player.equipment.equip(item, EquipSlot.LEFT_HAND);
      removeInventoryItem(id);
      if (old) addInventoryItem(old.itemId);
      G.player.equipment.syncToLegacy();
    } else {
      const old = G.equippedRod; G.equippedRod = id; removeInventoryItem(id); if (old) addInventoryItem(old);
    }
    addLog(`🎣 装备了${def.name}（主手）`, 'system');
    renderInventory();
    return;
  }
  // Equip gathering tools -> 主手
  if (def.type === 'tool' && (def.tool_type === 'axe' || def.tool_type === 'pickaxe' || def.tool_type === 'shovel')) {
    if (G.player) {
      const dur = G.toolDurability[id] != null ? G.toolDurability[id] : def.durability;
      const item = new EquipItem(id, def, def.grade, dur);
      const old = G.player.equipment.equip(item, EquipSlot.LEFT_HAND);
      removeInventoryItem(id);
      if (old) { addInventoryItem(old.itemId); G.toolDurability[old.itemId] = old.durability; }
      G.player.equipment.syncToLegacy();
    } else {
      const old = G.equippedTool; G.equippedTool = id; removeInventoryItem(id); if (old) addInventoryItem(old);
      if (!G.toolDurability[id] && def.durability) G.toolDurability[id] = def.durability;
    }
    addLog(`🔧 装备了${def.name}（主手）`, 'system');
    renderInventory();
    return;
  }
  // Container: drink water from water_skin or water_bucket
  if (def.type === 'tool' && def.tool_type === 'container') {
    if (id === 'water_skin' || id === 'water_bucket') {
      const restore = id === 'water_bucket' ? 40 : 25;
      G.stats.water = Math.min(100, G.stats.water + restore);
      addLog(`💧 饮用了${def.name}中的水，饮水+${restore}`, 'good');
      renderAll();
      return;
    }
  }
  // Bait equip
  if (def.type === 'bait' || GAME_DATA.items.baits[id]) {
    if (G.player) {
      const item = new EquipItem(id, def, def.grade, -1);
      const old = G.player.equipment.equip(item, EquipSlot.BAIT);
      removeInventoryItem(id);
      if (old) addInventoryItem(old.itemId);
      G.player.equipment.syncToLegacy();
    } else {
      const old = G.equippedBait; G.equippedBait = id; removeInventoryItem(id); if (old) addInventoryItem(old);
    }
    addLog(`🪱 装备了${def.name}作为钓饵`, 'system');
    renderInventory();
    return;
  }

  addLog(`❓ 不知道如何使用${def.name}`, 'warning');
}

let achievementCheckInterval = 0;
function checkAchievements() {
  if (!G.achievements) G.achievements = [];
  for (const ach of ACHIEVEMENTS) {
    if (G.achievements.includes(ach.id)) continue;
    try {
      if (ach.check()) {
        G.achievements.push(ach.id);
        addLog(`🏆 成就解锁：${ach.name}！${ach.reward}`, 'good');
        showToast(`🏆 ${ach.name}！`, 'good');
        if (ach.rewardItem) {
          addInventoryItem(ach.rewardItem[0], ach.rewardItem[1]);
        }
      }
    } catch(e) {}
  }
}

function saveGame() {
  try {
    // v2: Save Equipment class data
    if (G.player && G.player.equipment) {
      G.equipment = G.player.equipment.toDict();
      G.player.equipment.syncToLegacy();
    }
    localStorage.setItem('sky_island_save', JSON.stringify(G));
    const indicator = document.getElementById('save-indicator');
    indicator.classList.add('show');
    setTimeout(()=>indicator.classList.remove('show'), 1500);
  } catch(e) {
    console.error('Save failed:', e);
  }
}

function loadGame() {
  try {
    const data = localStorage.getItem('sky_island_save');
    if (!data) { addLog('❌ 没有找到存档', 'warning'); return false; }
    G = JSON.parse(data);
    // v2: Migrate old save format and create Equipment/Player objects
    G = migrateToV2(G);
    if (!G.playerId) G.playerId = 'player_' + Math.random().toString(36).substr(2,6);
    // Create Equipment and Player from save data
    const eq = Equipment.fromDict(G.equipment);
    const stats = G.stats || { hp:100, maxHp:100, hunger:100, water:100, mental:100, atk:5, defense:0 };
    G.player = new Player(stats, eq);
    G.player.equipment.syncToLegacy();
    applyTalentEffects();
    initGarden();
    showScreen('game-screen');
    startGameClock();
    renderAll();
    addLog('📂 读取存档成功！', 'system');
    return true;
  } catch(e) {
    console.error('Load failed:', e);
    return false;
  }
}

// Real-time clock - updates every second
let clockTimer = null;
function startGameClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    if (!G || !G.gameStarted) return;
    // 现实1天 = 游戏1周: 每秒+7秒
    const prevMinute = G.minute || 0;
    const prevHour = G.hour || 0;
    G.second = (G.second || 0) + 7;
    while (G.second >= 60) { G.second -= 60; G.minute = (G.minute || 0) + 1; }
    while (G.minute >= 60) { G.minute -= 60; G.hour = (G.hour || 0) + 1; }
    while (G.hour >= 24) { G.hour -= 24; G.day++; checkDailyEvents(); }
    // 游戏时间每过1分钟恢复精力
    const curMinute = G.minute || 0;
    if (curMinute !== prevMinute) {
      regenEnergy();
    }
    // 每小时触发生存tick
    const curHour = G.hour || 0;
    if (curHour !== prevHour) {
      tickSurvival();
      updateWeather();
      checkDisasters();
      G.totalTurns = (G.totalTurns || 0) + 1;
      // Auto save every 50 turns
      if (G.totalTurns - (G.lastAutoSave || 0) >= 50) {
        saveGame();
        G.lastAutoSave = G.totalTurns;
      }
    }
    // 检查并卸下损坏的装备
    unequipBrokenItems();
    // Update clock and energy display
    const el = document.getElementById('game-clock');
    if (el) el.textContent = `${String(G.hour).padStart(2,'0')}:${String(G.minute||0).padStart(2,'0')}:${String(G.second||0).padStart(2,'0')}`;
    renderStatusBar();
  }, 1000);
}

let selectedTalent = null;
let randomTalents = []; // 随机3个天赋

function renderTalentSelection() {
  const grid = document.getElementById('talent-grid');
  grid.innerHTML = '';
  randomTalents = getRandomTalents(3);
  for (const t of randomTalents) {
    const gradeColors = {SSS:'#ff00ff',SS:'#ff6600',S:'#ff0000',A:'#ffcc00',B:'#00ccff',C:'#cc66ff',D:'#66cc66',E:'#999999',F:'#666666'};
    const color = gradeColors[t.grade] || '#888';
    const card = document.createElement('div');
    card.className = 'talent-card';
    card.style.borderColor = color;
    card.innerHTML = `
      <div class="t-icon">${t.icon}</div>
      <div class="t-name">${t.name} <span style="color:${color};font-size:0.8em">[${t.grade}]</span></div>
      <div class="t-desc">${t.desc}</div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.talent-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      card.style.borderColor = 'var(--accent)';
      selectedTalent = t.id;
      document.getElementById('confirm-talent-btn').disabled = false;
    };
    grid.appendChild(card);
  }
}

function confirmTalent() {
  if (!selectedTalent) return;
  G.chosenTalent = selectedTalent;
  applyTalentEffects();
  G.gameStarted = true;

  // Give starting items (only fishing rod)
  for (const [id, count] of Object.entries(INITIAL_ITEMS)) {
    addInventoryItem(id, count);
  }

  // Auto-equip fishing rod
  useItem('wood_rod');

  initGarden();

  showScreen('game-screen');
  renderAll();
  addLog('🏝️ 欢迎来到空岛求生！你醒来时发现自己身处一座浮空岛上。', 'system');
  addLog('📋 前7天是安全期，利用这段时间收集资源、建造庇护所。', 'system');
  addLog('💡 提示：探索岛屿收集资源，制作工具和武器。', 'system');
  addLog('🎣 钓鱼竿已装备，可以开始钓鱼获取食物。', 'system');
  saveGame();
}

let currentTab = 'main';

function renderTabs() {
  const nav = document.getElementById('nav-tabs');
  nav.innerHTML = '';
  for (const tab of TAB_DEFS) {
    const btn = document.createElement('button');
    btn.className = 'nav-tab' + (currentTab===tab.id?' active':'');
    btn.textContent = tab.name;
    btn.onclick = () => switchTab(tab.id);
    nav.appendChild(btn);
  }
}

function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  renderTabs();
  TAB_DEFS.find(t=>t.id===id)?.render();
}

function regenEnergy() {
  // 精力上限公式：160 + 精神×3 + 等级×2
  G.stats.maxEnergy = 160 + (G.stats.spirit||10) * 3 + (G.playerLevel||1) * 2;
  // 精力恢复公式：每小时恢复 15 + 精神×0.5 + 上限×0.02
  let regenPerHour = 15 + (G.stats.spirit||10) * 0.5 + G.stats.maxEnergy * 0.02;
  // 饱食度/饮水度影响精力恢复
  const hunger = G.stats.hunger || 0;
  const water = G.stats.water || 0;
  if (hunger <= 0 || water <= 0) {
    regenPerHour = 0;
  } else if (hunger < 30 || water < 30) {
    regenPerHour *= 0.3;
  } else if (hunger < 50 || water < 50) {
    regenPerHour *= 0.6;
  }
  // 天赋加成
  regenPerHour *= getTalentMult('energyRegenMult', 1);
  // 每分钟恢复 = 每小时恢复 / 60
  const regenPerMinute = regenPerHour / 60;
  G.stats.energy = Math.min(G.stats.maxEnergy, G.stats.energy + regenPerMinute);
}

function renderBuffBar() {
  const bar = document.getElementById('buff-bar');
  if (!bar) return;
  let buffs = [];

  // Weather effects
  if (G.weather === 'rainy') buffs.push({icon:'🌧️',text:'雨天：采集+20%，精神-0.5/h',type:'neutral'});
  if (G.weather === 'foggy') buffs.push({icon:'🌫️',text:'雾天：遇敌率+20%',type:'debuff'});
  if (G.weather === 'stormy') buffs.push({icon:'⛈️',text:'暴风雨：采集-50%，精神-1/h',type:'debuff'});
  if (G.weather === 'cold') buffs.push({icon:'❄️',text:'寒冷：饥饿消耗x1.5',type:'debuff'});
  if (G.weather === 'void_storm') buffs.push({icon:'🌀',text:'虚空风暴：资源减半，怪物翻倍',type:'debuff'});

  // Profession passives
  for (const p of G.professions) {
    const prof = PROFESSIONS[p];
    if (prof) buffs.push({icon:prof.icon, text:prof.name+': '+prof.desc, type:'profession'});
  }

  // Talent effects
  if (G.chosenTalent) {
    const t = START_TALENTS.find(x=>x.id===G.chosenTalent);
    if (t) buffs.push({icon:t.icon, text:t.name+': '+t.desc, type:'buff'});
  }

  // Active combat skill buffs
  if (combatState) {
    if (combatState.tauntActive) buffs.push({icon:'😤',text:'嘲讽中：伤害-30%',type:'buff'});
    if (combatState.dodgeBonus > 0) buffs.push({icon:'💨',text:'闪避提升+'+Math.round(combatState.dodgeBonus*100)+'%',type:'buff'});
    if (combatState.tempDefMult > 1) buffs.push({icon:'🛡️',text:'防御翻倍',type:'buff'});
    if (combatState.guaranteedCrit) buffs.push({icon:'💥',text:'下次必暴击',type:'buff'});
  }

  // Skill cooldowns
  for (const sid of G.skills) {
    const cd = G.skillCooldowns[sid] || 0;
    if (cd > 0) {
      const skill = SKILLS[sid];
      if (skill) buffs.push({icon:'⏳',text:skill.name+'冷却:'+cd+'回合',type:'neutral'});
    }
  }

  bar.innerHTML = buffs.map(b => `<span class="buff-badge ${b.type}">${b.icon} ${b.text}</span>`).join('') || '';
}

// Island upgrade tiers
const ISLAND_TIERS = [
  {name:'浮空石',     size:100,  desc:'初始空岛',                     cost:{},                         unlock:{},          defense:0,  plots:3,  buildSlots:3},
  {name:'小型空岛',   size:200,  desc:'可建造更多设施',               cost:{expand_voucher:2},          unlock:{},          defense:1,  plots:5,  buildSlots:5},
  {name:'中型空岛',   size:400,  desc:'解锁种植和更多建筑',           cost:{expand_voucher:4,stone:50}, unlock:{},          defense:3,  plots:8,  buildSlots:8},
  {name:'大型空岛',   size:700,  desc:'可建造高级设施',               cost:{expand_voucher:8,iron_ore:30,crystal:10}, unlock:{}, defense:5, plots:12, buildSlots:12},
  {name:'巨型空岛',   size:1100, desc:'防御工事完善',                 cost:{expand_voucher:12,void_stone:10,crystal:20}, unlock:{}, defense:10, plots:16, buildSlots:16},
  {name:'浮空堡垒',   size:2000, desc:'虚空防护加强',                 cost:{expand_voucher:18,void_essence:8,star_fragment:3}, unlock:{}, defense:18, plots:22, buildSlots:22},
  {name:'天空城邦',   size:3500, desc:'可容纳更多建筑和农田',         cost:{expand_voucher:25,chaos_core:2,star_fragment:5}, unlock:{}, defense:28, plots:30, buildSlots:30},
  {name:'浮空大陆',   size:5000, desc:'终极空岛形态',                 cost:{expand_voucher:35,chaos_core:5,void_essence:15}, unlock:{}, defense:40, plots:40, buildSlots:40},
];

function getIslandTier() {
  let tierIdx = 0;
  for (let i = ISLAND_TIERS.length - 1; i >= 0; i--) {
    if (G.islandSize >= ISLAND_TIERS[i].size) { tierIdx = i; break; }
  }
  return tierIdx;
}

function getNextIslandTier() {
  const current = getIslandTier();
  if (current >= ISLAND_TIERS.length - 1) return null;
  return current + 1;
}

function expandIsland() {
  const nextIdx = getNextIslandTier();
  if (nextIdx === null) {
    addLog('🏝️ 空岛已达最大等级！', 'system');
    return;
  }

  const nextTier = ISLAND_TIERS[nextIdx];
  const cost = nextTier.cost;
  const pioneerMult = hasProfession('pioneer') ? 0.85 : 1;

  // Check all costs
  for (const [itemId, need] of Object.entries(cost)) {
    const actual = Math.ceil(need * (itemId === 'expand_voucher' ? pioneerMult : 1));
    if ((G.inventory[itemId]||0) < actual) {
      addLog(`❌ 缺少${getItemName(itemId)} x${actual}（拥有${G.inventory[itemId]||0}）`, 'warning');
      return;
    }
  }

  // Consume costs
  for (const [itemId, need] of Object.entries(cost)) {
    const actual = Math.ceil(need * (itemId === 'expand_voucher' ? pioneerMult : 1));
    removeInventoryItem(itemId, actual);
  }

  const oldSize = G.islandSize;
  G.islandSize = nextTier.size;
  G.defense += nextTier.defense;

  // Unlock garden plots
  while (G.garden.length < nextTier.plots) {
    G.garden.push({id:null, timer:0, stage:0});
  }

  const costText = Object.entries(cost).map(([id,n])=>`${getItemName(id)} x${Math.ceil(n*(id==='expand_voucher'?pioneerMult:1))}`).join(', ');
  addLog(`🏝️ 空岛升级！${ISLAND_TIERS[nextIdx-1]?.name||'浮空石'} → ${nextTier.name}！`, 'good');
  addLog(`  大小：${oldSize} → ${G.islandSize} | 防御+${nextTier.defense} | 农田${nextTier.plots}格 | 消耗：${costText}`, 'system');
  showToast(`🏝️ 升级为${nextTier.name}！`, 'good');
  checkAchievements();
  renderAll();
  saveGame();
}

function openChestFromInventory(chestId) {
  const tier = chestId.replace('chest_', '');
  const chestDef = GAME_DATA.gameplay.chest_tiers[tier];
  if (!chestDef) { addLog('❌ 无效宝箱', 'warning'); return; }
  if (!G.inventory[chestId] || G.inventory[chestId] <= 0) { addLog('❌ 没有这个宝箱', 'warning'); return; }

  // 检查钥匙
  if (chestDef.key_required) {
    const keyId = chestDef.key_id;
    if (!G.inventory[keyId] || G.inventory[keyId] <= 0) {
      addLog(`🔒 需要${getItemName(keyId)}才能开启${chestDef.name}！`, 'warning');
      return;
    }
    G.inventory[keyId]--;
    if (G.inventory[keyId] <= 0) delete G.inventory[keyId];
  }

  // 消耗宝箱
  G.inventory[chestId]--;
  if (G.inventory[chestId] <= 0) delete G.inventory[chestId];

  // 开启宝箱
  G.chestOpened++;
  const pool = chestDef.loot_pool;
  const loot = [];
  for (const entry of pool) {
    if (Math.random() < (entry.weight / 100) * 1.5) {
      const count = entry.min + Math.floor(Math.random() * (entry.max - entry.min + 1));
      addInventoryItem(entry.id, count);
      loot.push(getItemName(entry.id) + 'x' + count);
    }
  }
  if (loot.length === 0) {
    addInventoryItem('wood', 2);
    loot.push('木材x2');
  }
  addLog(`📦 开启${chestDef.name}：${loot.join(', ')}`, 'loot');
  renderInventory();
}

function unequipItem(slot) {
  const slotMap = {
    left_hand: EquipSlot.LEFT_HAND, right_hand: EquipSlot.RIGHT_HAND,
    head: EquipSlot.HEAD, body: EquipSlot.BODY, back: EquipSlot.BACK,
    accessory: EquipSlot.ACCESSORY, bait: EquipSlot.BAIT,
    // Legacy compat
    weapon: EquipSlot.LEFT_HAND, armor: EquipSlot.BODY, rod: EquipSlot.LEFT_HAND, tool: EquipSlot.LEFT_HAND,
  };
  if (G.player) {
    const eqSlot = slotMap[slot];
    if (!eqSlot) return;
    const item = G.player.equipment.unequip(eqSlot);
    if (item) {
      addInventoryItem(item.itemId);
      if (item.durability >= 0) G.toolDurability[item.itemId] = item.durability;
      G.player.equipment.syncToLegacy();
      addLog(`卸下了${item.name}`, 'system');
    }
  } else {
    let item = null;
    switch(slot) {
      case 'weapon': item = G.equippedWeapon; G.equippedWeapon = null; break;
      case 'armor': item = G.equippedArmor; G.equippedArmor = null; break;
      case 'head': item = G.equippedHead; G.equippedHead = null; break;
      case 'rod': item = G.equippedRod; G.equippedRod = null; break;
      case 'tool': item = G.equippedTool; G.equippedTool = null; break;
    }
    if (item) { addInventoryItem(item); addLog(`卸下了${getItemName(item)}`, 'system'); }
  }
  renderInventory();
}

function getStorageSlots() {
  let slots = 0;
  if (G.buildings.basic_storage) slots += 9;
  if (G.buildings.storage) slots += 20;
  return slots;
}

function storeItem(itemId, count) {
  if (!G.storage) G.storage = {};
  const has = G.inventory[itemId] || 0;
  if (has < count) return false;
  G.inventory[itemId] -= count;
  if (G.inventory[itemId] <= 0) delete G.inventory[itemId];
  G.storage[itemId] = (G.storage[itemId] || 0) + count;
  return true;
}

function retrieveItem(itemId, count) {
  if (!G.storage) G.storage = {};
  const has = G.storage[itemId] || 0;
  if (has < count) return false;
  G.storage[itemId] -= count;
  if (G.storage[itemId] <= 0) delete G.storage[itemId];
  addInventoryItem(itemId, count);
  return true;
}

function renderStorage() {
  const panel = document.getElementById('tab-storage');
  const hasStorage = G.buildings.basic_storage || G.buildings.storage;
  if (!hasStorage) {
    panel.innerHTML = '<div class="panel"><h3>📦 储物箱</h3><p style="color:var(--text2)">需要先建造"基础储物箱"建筑</p></div>';
    return;
  }

  const slots = getStorageSlots();
  const storageItems = Object.entries(G.storage || {}).filter(([k,v]) => v > 0);
  const usedSlots = storageItems.length;

  let html = `
    <div class="panel">
      <h3>📦 储物箱 (${usedSlots}/${slots}格)</h3>
      <p style="font-size:0.85em;color:var(--text2);margin-bottom:10px">点击物品可存入/取出</p>
      <div class="item-grid">
  `;

  // Storage items
  for (const [id, count] of storageItems) {
    const def = getItemDef(id);
    const grade = def?.grade || 'F';
    html += `
      <div class="item-card grade-${grade}" onclick="showStorageModal('${id}','retrieve')">
        <div class="item-icon">${getItemIcon(id)}</div>
        <div class="item-name">${def?.name||id}</div>
        <div class="item-count">x${count}</div>
      </div>
    `;
  }

  // Empty slots
  for (let i = usedSlots; i < slots; i++) {
    html += `<div class="item-card" style="opacity:0.3;border-style:dashed"><div class="item-icon">📦</div><div class="item-name">空</div></div>`;
  }

  html += '</div></div>';

  // Store items section
  const invItems = Object.entries(G.inventory).filter(([k,v]) => v > 0);
  html += `
    <div class="panel">
      <h3>📥 存入物品</h3>
      <div class="item-grid">
  `;
  for (const [id, count] of invItems) {
    const def = getItemDef(id);
    const grade = def?.grade || 'F';
    html += `
      <div class="item-card grade-${grade}" onclick="showStorageModal('${id}','store')">
        <div class="item-icon">${getItemIcon(id)}</div>
        <div class="item-name">${def?.name||id}</div>
        <div class="item-count">x${count}</div>
      </div>
    `;
  }
  html += '</div></div>';

  panel.innerHTML = html;
}

function showStorageModal(itemId, action) {
  const def = getItemDef(itemId);
  const isStore = action === 'store';
  const maxCount = isStore ? (G.inventory[itemId]||0) : (G.storage[itemId]||0);
  if (maxCount <= 0) return;

  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <h3>${isStore ? '📥 存入' : '📤 取出'} ${getItemIcon(itemId)} ${def?.name||itemId}</h3>
    <p style="color:var(--text2);margin:8px 0">可用数量: ${maxCount}</p>
    <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
      ${[1,5,10,maxCount].filter(n=>n>0&&n<=maxCount).map(n=>
        `<button class="action-btn" onclick="doStorage('${itemId}','${action}',${n})">${n===maxCount?'全部':n}</button>`
      ).join('')}
    </div>
    <div class="modal-actions"><button onclick="hideModal()" style="background:var(--bg3);color:var(--text)">取消</button></div>
  `;
  overlay.classList.add('active');
}

function doStorage(itemId, action, count) {
  if (action === 'store') {
    storeItem(itemId, count);
    addLog(`📥 存入${getItemName(itemId)} x${count}`, 'system');
  } else {
    retrieveItem(itemId, count);
    addLog(`📤 取出${getItemName(itemId)} x${count}`, 'system');
  }
  hideModal();
  renderStorage();
  renderInventory();
}

function renderAchievements() {

  const pct = total > 0 ? Math.round(done/total*100) : 0;

  let html = `
    <div class="panel">

      <div style="width:100%;height:10px;background:#333;border-radius:5px;margin:8px 0;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:var(--gold);border-radius:5px;transition:width 0.5s"></div>
      </div>
      <div class="ach-grid">
  `;

  for (const ach of ACHIEVEMENTS) {

function renderCombat() {
  if (!combatState) return;
  const panel = document.getElementById('tab-main');
  const enemies = combatState.enemies;

  let enemyHtml = '';
  for (const e of enemies) {
    if (e.currentHp <= 0) continue;
    const hpPct = Math.round(e.currentHp/e.maxHp*100);
    const hpColor = hpPct > 60 ? 'var(--green)' : hpPct > 30 ? 'var(--yellow)' : 'var(--red)';
    const enemyExp = Math.max(5, Math.floor((e.maxHp || 10) * 0.5 + (e.atk || 3) * 2 + (e.reward_exp || 10)));
    enemyHtml += `
      <div style="display:inline-block;margin:8px;text-align:center;min-width:120px;background:rgba(255,255,255,0.03);padding:12px;border-radius:8px;border:1px solid var(--border)">
        <div style="font-size:2.5em">${e.name.includes('鼠')?'🐀':e.name.includes('狼')?'🐺':e.name.includes('猪')?'🐗':e.name.includes('鹰')?'🦅':e.name.includes('龙')?'🐉':e.name.includes('熊')?'🐻':e.name.includes('虚空')?'🌀':'👹'}</div>
        <div style="font-weight:bold;color:var(--accent);margin:4px 0">${e.name}</div>
        <div style="font-size:0.8em;color:var(--text2)">HP: ${e.currentHp}/${e.maxHp} | ATK: ${e.atk||5}</div>
        <div class="enemy-hp-bar"><div class="enemy-hp-fill" style="width:${hpPct}%;background:${hpColor}"></div></div>
        <div style="font-size:0.7em;color:var(--gold)">⭐${enemyExp} EXP</div>
        ${e.poisoned?'<span style="font-size:0.7em;color:var(--green)">☠️中毒</span>':''}
        ${e.stunned?'<span style="font-size:0.7em;color:var(--yellow)">💫眩晕</span>':''}
        <button class="action-btn" onclick="playerAttack(${e.index})" ${!combatState.playerTurn?'disabled':''} style="font-size:0.8em;padding:4px 12px;margin-top:6px">⚔️ 攻击</button>
      </div>
    `;
  }

  // Skills
  let skillHtml = '';
  for (const sid of G.skills) {
    const skill = SKILLS[sid];
    if (!skill || skill.type !== 'active') continue;
    const cd = G.skillCooldowns[sid] || 0;
    skillHtml += `<button class="action-btn" onclick="useCombatSkill('${sid}')" ${!combatState.playerTurn||cd>0?'disabled':''}>${skill.icon} ${skill.name} ${cd>0?'('+cd+')':''}</button>`;
  }

  // Usable items
  let itemHtml = '';
  const combatItems = Object.entries(G.inventory).filter(([id,c]) => {
    const def = getItemDef(id);
    return c > 0 && def && (def.heal || def.hunger_restore || def.water_restore || def.mana_restore);
  });
  for (const [id, count] of combatItems.slice(0,4)) {
    itemHtml += `<button class="action-btn" onclick="playerUseItem('${id}')" ${!combatState.playerTurn?'disabled':''}>${getItemIcon(id)} ${getItemName(id)}(x${count})</button>`;
  }

  // Player stats display
  const playerAtk = calcPlayerAtk();
  const playerDefVal = calcPlayerDef();

  panel.innerHTML = `
    <div class="combat-screen">
      <h2 style="color:var(--accent)">⚔️ 战斗！${combatState.isDisaster?'（灾难来袭！）':''}</h2>
      <div style="font-size:0.85em;color:var(--text2);margin-bottom:8px">你的攻击:${playerAtk} | 防御:${playerDefVal}</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center">${enemyHtml}</div>
      <div style="font-size:0.9em;color:var(--text2)">回合 ${combatState.turn} | ${combatState.playerTurn?'<span style="color:var(--accent)">▶ 你的行动</span>':'<span style="color:var(--yellow)">⏳ 敌人回合...</span>'} | EXP: ${G.playerExp||0}/${G.expToNext||100}</div>
      <div class="combat-actions">
        <button class="action-btn" onclick="playerDefend()" ${!combatState.playerTurn?'disabled':''}>🛡️ 防御</button>
        ${itemHtml}
        ${skillHtml}
        <button class="action-btn danger" onclick="playerFlee()" ${!combatState.playerTurn?'disabled':''}>🏃 逃跑</button>
      </div>
      <div class="combat-log">${combatState.log.slice(-10).map(l=>'<div>'+l+'</div>').join('')}</div>
    </div>
  `;
  switchTab('main');
}

function showChoiceEvent(evt) {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  let choicesHtml = '';
  for (const choice of evt.choices) {
    choicesHtml += `<button class="action-btn" onclick="handleChoice('${evt.id}','${choice.outcome}',${JSON.stringify(choice).replace(/"/g,'&quot;')})" style="margin:4px">${choice.text}</button>`;
  }
  box.innerHTML = `

    <div class="modal-actions" style="flex-direction:column">${choicesHtml}</div>
  `;

function handleChoice(evtId, outcome, choice) {
  hideModal();
  if (choice.outcome === 'explore') {
    if (Math.random() < (choice.success_chance||0.5)) {
      const s = choice.success;
      if (s) {
        if (s.items) {
          for (const [id, range] of Object.entries(s.items)) {
            const count = range[0] + Math.floor(Math.random()*(range[1]-range[0]+1));
            addInventoryItem(id, count);
            addLog(`获得${getItemName(id)} x${count}`, 'loot');
          }
        }
      }
      addLog(`探索成功！`, 'good');
    } else {
      const dmg = choice.fail?.damage || 10;
      G.stats.hp -= dmg;
      addLog(`探索失败！受到${dmg}点伤害！`, 'combat');
    }
  } else if (choice.outcome === 'search') {
    const reward = choice.reward;
    if (reward) {
      for (const [id, range] of Object.entries(reward)) {
        const count = range[0] + Math.floor(Math.random()*(range[1]-range[0]+1));
        addInventoryItem(id, count);
        addLog(`获得${getItemName(id)} x${count}`, 'loot');
      }
    }
  } else if (choice.outcome === 'combat') {
    const enemies = [];
    if (choice.enemies) {
      for (const e of choice.enemies) {
        const cdef = getCreatureDef(e.id);
        if (cdef) enemies.push({...cdef});
      }
    }
    if (enemies.length > 0) startCombat(enemies);
  } else if (choice.outcome === 'flee') {
    if (Math.random() < (choice.flee_chance||0.5)) {
      addLog('成功逃离！', 'system');
    } else {
      const dmg = choice.fail?.damage || 10;
      G.stats.hp -= dmg;
      addLog(`逃跑失败！受到${dmg}点伤害！`, 'combat');
    }
  } else {
    addLog('你安全地离开了。', 'system');
  }

  if (G.stats.hp <= 0) gameOver();
  renderAll();
}

function showItemModal(id) {
  const def = getItemDef(id);
  if (!def) return;
  const count = G.inventory[id] || 0;
  const grade = def.grade || 'F';
  const gradeInfo = GAME_DATA.items.grade_config[grade] || {name:'凡品',color:'⬜'};

  let actions = '';
  // Use button
  if (def.type === 'food' || def.type === 'consumable' || def.type === 'potion' ||
      def.type === 'profession_book' || def.type === 'profession_scroll' || def.type === 'skill_book' || def.type === 'blueprint' ||
      def.type === 'seed' || id === 'expand_voucher') {
    actions += `<button onclick="useItem('${id}');hideModal();renderAll()" style="background:var(--green);color:#fff">使用</button>`;
  }
  // Equip button
  if (def.type === 'weapon' || def.type === 'armor' || def.type === 'tool' || def.type === 'bait') {
    actions += `<button onclick="useItem('${id}');hideModal();renderAll()" style="background:var(--accent2);color:#fff">装备</button>`;
  }
  // Reroll affixes button (smith only, for equipment with affixes)
  if (['weapon','armor','tool'].includes(def.type) && hasProfession('smith') && G.itemAffixes && G.itemAffixes[id]) {
    actions += `<button onclick="rerollAffixes('${id}');showItemModal('${id}')" style="background:var(--orange);color:#fff">🔨 重铸词条</button>`;
  }
  // Chest open button
  if (id.startsWith('chest_')) {
    actions += `<button onclick="openChestFromInventory('${id}');hideModal();renderAll()" style="background:var(--gold);color:#000">📦 打开宝箱</button>`;
  }
  // Discard button
  actions += `<button onclick="discardItem('${id}')" style="background:var(--red);color:#fff">🗑️ 丢弃</button>`;

  const stats = [];
  if (def.atk) stats.push(`攻击 +${def.atk}`);
  if (def.def) stats.push(`防御 +${def.def}`);
  if (def.heal) stats.push(`恢复 ${def.heal} HP`);
  if (def.hunger_restore) stats.push(`饱食 +${def.hunger_restore}`);
  if (def.water_restore) stats.push(`饮水 +${def.water_restore}`);
  if (def.durability) stats.push(`耐久 ${def.durability}`);
  if (def.power) stats.push(`力量 ${def.power}`);

  // Affix display
  const affixHtml = formatAffixes(id);
  const affixes = G.itemAffixes ? G.itemAffixes[id] : null;
  const affixCount = affixes ? affixes.length : 0;

  // Calculate total stats with affixes
  let totalStats = '';
  if (affixes && affixes.length > 0) {
    const bonuses = getAffixBonuses(id);
    const bonusParts = [];
    if (bonuses.atk) bonusParts.push(`攻击+${bonuses.atk}`);
    if (bonuses.def) bonusParts.push(`防御+${bonuses.def}`);
    if (bonuses.maxHp) bonusParts.push(`HP+${bonuses.maxHp}`);
    if (bonuses.critPct) bonusParts.push(`暴击+${bonuses.critPct}%`);
    if (bonuses.critDmg) bonusParts.push(`暴伤+${bonuses.critDmg}%`);
    if (bonuses.lifesteal) bonusParts.push(`吸血+${bonuses.lifesteal}%`);
    if (bonuses.dodgePct) bonusParts.push(`闪避+${bonuses.dodgePct}%`);
    if (bonuses.dmgReduce) bonusParts.push(`减伤+${bonuses.dmgReduce}%`);
    if (bonuses.fireDmg) bonusParts.push(`火焰+${bonuses.fireDmg}`);
    if (bonuses.iceDmg) bonusParts.push(`冰霜+${bonuses.iceDmg}`);
    if (bonuses.voidDmg) bonusParts.push(`虚空+${bonuses.voidDmg}`);
    if (bonusParts.length > 0) totalStats = `<p style="color:var(--gold);font-size:0.85em">✦ 总加成：${bonusParts.join(' ')}</p>`;
  }

  showModal(`${getItemIcon(id)} ${def.name}${affixCount>0?' ✦':''}`, `
    <p style="color:var(--text2);margin-bottom:8px">${def.desc}</p>
    <p>品质：${gradeInfo.color} ${gradeInfo.name} (${grade})</p>
    <p>数量：${count}</p>
    ${stats.length?`<p>基础属性：${stats.join(' | ')}</p>`:''}
    ${affixHtml}
    ${totalStats}
    <div class="modal-actions">${actions}</div>
  `);
}

function checkRandomEncounter() {
  let chance = getAttackChance();
  if (chance <= 0) return;

  // Weather effects on encounter rate
  if (G.weather === 'foggy') chance *= 1.2;
  if (G.weather === 'void_storm') chance *= 2;

  // 遇敌率降低天赋
  chance *= (1 - getTalentEffect('encounterReduce', 0));

  if (Math.random() > chance) return;

  // Determine enemy based on day
  const beasts = GAME_DATA.creatures.wild_beasts;
  let pool = beasts.filter(b => {
    if (b.id === 'rat' && G.day >= 1) return true;
    if (b.id === 'wolf' && G.day >= 8) return true;
    if (b.id === 'boar' && G.day >= 15) return true;
    if (b.id === 'void_eagle' && G.day >= 25) return true;
    return false;
  });

  if (pool.length === 0) return;

  const enemy = pool[Math.floor(Math.random()*pool.length)];
  let count = 1 + Math.floor(Math.random()*2);
  // Void storm doubles monster spawn
  if (G.weather === 'void_storm') count *= 2;
  const enemies = [];
  for (let i=0; i<count; i++) enemies.push({...enemy});

  addLog(`⚠️ 遭遇了${count}只${enemy.name}！`, 'combat');
  startCombat(enemies);
}
