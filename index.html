<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>空岛求生 - Sky Island Survival</title>
<script src="game_data.js"></script>
<script type="module">
import { G as GModule, setG } from './js/state.js';
import { START_TALENTS, TALENT_GRADES, TALENT_GRADE_WEIGHTS, getRandomTalents, applyTalentEffects as applyTalentEffectsModule, getTalentEffect as getTalentEffectModule, getTalentMult as getTalentMultModule } from './js/talents.js';
import { EquipSlot, EquipItem, Equipment, Player, unequipBrokenItems as unequipBrokenItemsModule, migrateToV2 as migrateToV2Module } from './js/equipment.js';
import { calcPlayerAtk as calcPlayerAtkModule, getPlayerCritChance as getPlayerCritChanceModule, getPlayerCritDmg as getPlayerCritDmgModule, getPlayerLifesteal as getPlayerLifestealModule, getPlayerDodgeBonus as getPlayerDodgeBonusModule, calcPlayerDef as calcPlayerDefModule, playerAttack as playerAttackModule, enemyTurn as enemyTurnModule, combatVictory as combatVictoryModule, getCombatState, setCombatState, injectCombatDeps } from './js/combat.js';
import { hasTool as hasToolModule, gatherResource as gatherResourceModule, exploreIsland as exploreIslandModule, injectGatheringDeps } from './js/gathering.js';
import { startFishing as startFishingModule, determineFishCatch as determineFishCatchModule, injectFishingDeps } from './js/fishing.js';

// 暴露到全局
window.START_TALENTS = START_TALENTS;
window.TALENT_GRADES = TALENT_GRADES;
window.TALENT_GRADE_WEIGHTS = TALENT_GRADE_WEIGHTS;
window.getRandomTalents = getRandomTalents;
window.EquipSlot = EquipSlot;
window.EquipItem = EquipItem;
window.Equipment = Equipment;
window.Player = Player;
window._modules = {
  applyTalentEffects: applyTalentEffectsModule,
  getTalentEffect: getTalentEffectModule,
  getTalentMult: getTalentMultModule,
  unequipBrokenItems: unequipBrokenItemsModule,
  migrateToV2: migrateToV2Module,
  calcPlayerAtk: calcPlayerAtkModule,
  getPlayerCritChance: getPlayerCritChanceModule,
  getPlayerCritDmg: getPlayerCritDmgModule,
  getPlayerLifesteal: getPlayerLifestealModule,
  getPlayerDodgeBonus: getPlayerDodgeBonusModule,
  calcPlayerDef: calcPlayerDefModule,
  playerAttack: playerAttackModule,
  enemyTurn: enemyTurnModule,
  combatVictory: combatVictoryModule,
  hasTool: hasToolModule,
  gatherResource: gatherResourceModule,
  exploreIsland: exploreIslandModule,
  startFishing: startFishingModule,
  determineFishCatch: determineFishCatchModule,
  setG,
};
console.log('✅ 模块加载完成');
</script>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460; --panel: #1a1a3e;
  --text: #e0e0e0; --text2: #a0a0c0; --accent: #e94560; --accent2: #0ea5e9;
  --green: #22c55e; --yellow: #eab308; --red: #ef4444; --purple: #a855f7;
  --blue: #3b82f6; --orange: #f97316; --gold: #fbbf24;
  --border: #334155; --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
button { cursor:pointer; font-family:inherit; border:none; outline:none; }
button:active { transform:scale(0.96); }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ===== SCREENS ===== */
.screen { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
.screen.active { display:flex; }

/* ===== TITLE SCREEN ===== */
#title-screen {
  flex-direction:column; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
}
#title-screen h1 { font-size:3em; margin-bottom:10px; text-shadow: 0 0 30px rgba(233,69,96,0.5); }
#title-screen h2 { color:var(--text2); margin-bottom:40px; font-weight:normal; }
.title-btn {
  padding:14px 48px; margin:8px; font-size:1.1em; border-radius:var(--radius);
  background: linear-gradient(135deg, var(--accent), #c0392b); color:#fff;
  transition: all 0.2s;
}
.title-btn:hover { box-shadow: 0 0 20px rgba(233,69,96,0.4); }
.title-btn.secondary { background: linear-gradient(135deg, var(--bg3), #1a365d); }

/* ===== TALENT SELECTION ===== */
#talent-screen {
  flex-direction:column; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #0f0c29, #1a1a3e);
  padding:20px; overflow-y:auto;
}
#talent-screen h2 { margin-bottom:20px; }
.talent-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:12px; max-width:900px; width:100%; }
.talent-card {
  background:var(--panel); border:2px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:all 0.2s;
}
.talent-card:hover, .talent-card.selected { border-color:var(--accent); box-shadow:0 0 15px rgba(233,69,96,0.3); }
.talent-card .t-icon { font-size:2em; }
.talent-card .t-name { font-weight:bold; font-size:1.1em; margin:6px 0; }
.talent-card .t-desc { color:var(--text2); font-size:0.9em; }

/* ===== MAIN GAME ===== */
#game-screen { flex-direction:column; }

/* Status Bar */
.status-bar {
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  background:var(--bg2); border-bottom:1px solid var(--border);
  flex-wrap:wrap; min-height:48px;
}
.stat-item { display:flex; align-items:center; gap:4px; font-size:0.85em; white-space:nowrap; }
.stat-bar-wrap { width:60px; height:8px; background:#333; border-radius:4px; overflow:hidden; position:relative; }
.stat-bar-fill { height:100%; border-radius:4px; transition:width 0.3s; }
.stat-bar-fill.hp { background:var(--red); }
.stat-bar-fill.hunger { background:var(--orange); }
.stat-bar-fill.water { background:var(--blue); }
.stat-bar-fill.mental { background:var(--purple); }
.stat-bar-fill.energy { background:var(--accent2); }
.stat-val { min-width:28px; text-align:right; font-size:0.8em; color:var(--text2); }
.time-info { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:0.85em; color:var(--accent2); }

/* Nav Tabs */
.nav-tabs {
  display:flex; background:var(--bg2); border-bottom:1px solid var(--border);
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.nav-tab {
  padding:10px 16px; font-size:0.9em; color:var(--text2); background:none;
  border-bottom:2px solid transparent; white-space:nowrap; transition:all 0.2s;
}
.nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* Main Content */
.main-content { flex:1; overflow:hidden; display:flex; flex-direction:column; }
.tab-panel { display:none; flex:1; overflow-y:auto; padding:12px; }
.tab-panel.active { display:block; }

/* Log Panel */
.log-panel {
  height:140px; min-height:100px; background:var(--bg2); border-top:1px solid var(--border);
  overflow-y:auto; padding:8px 12px; font-size:0.85em; line-height:1.6;
}
.log-panel .log-entry { margin-bottom:2px; }
.log-panel .log-entry.combat { color:var(--red); }
.log-panel .log-entry.loot { color:var(--gold); }
.log-panel .log-entry.system { color:var(--accent2); }
.log-panel .log-entry.warning { color:var(--yellow); }
.log-panel .log-entry.good { color:var(--green); }

/* ===== PANELS ===== */
.panel { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:12px; }
.panel h3 { font-size:1em; margin-bottom:8px; color:var(--accent2); }
.panel-title { font-size:1.1em; font-weight:bold; margin-bottom:10px; color:var(--accent); }

/* Action Buttons */
.action-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; }
.action-btn {
  padding:10px; border-radius:var(--radius); font-size:0.9em;
  background:var(--bg3); color:var(--text); border:1px solid var(--border);
  transition:all 0.2s; text-align:center;
}
.action-btn:hover { border-color:var(--accent2); background:#1a4a7a; }
.action-btn:disabled { opacity:0.4; cursor:not-allowed; }
.action-btn.primary { background:linear-gradient(135deg,var(--accent),#c0392b); color:#fff; border-color:var(--accent); }
.action-btn.danger { background:linear-gradient(135deg,#991b1b,#7f1d1d); color:#fff; }

/* Items */
.item-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:6px; }
.item-card {
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  padding:8px; text-align:center; font-size:0.8em; cursor:pointer; position:relative;
  transition:all 0.15s; overflow:hidden;
}
.item-card:hover { border-color:var(--accent2); }
.item-card .item-icon { font-size:1.6em; margin-bottom:4px; }
.item-card .item-name { color:var(--text); }
.item-card .item-count { position:absolute; top:4px; right:6px; font-size:0.75em; color:var(--gold); }
.item-card.grade-F { border-left:3px solid #888; }
.item-card.grade-E { border-left:3px solid var(--green); }
.item-card.grade-D { border-left:3px solid var(--blue); }
.item-card.grade-C { border-left:3px solid var(--purple); }
.item-card.grade-B { border-left:3px solid var(--gold); }
.item-card.grade-A { border-left:3px solid var(--orange); }
.item-card.grade-S { border-left:3px solid var(--accent); }

/* Combat */
.combat-screen {
  background:linear-gradient(180deg, #1a0a2e 0%, #0a0a1e 100%);
  padding:20px; display:flex; flex-direction:column; align-items:center; gap:16px;
}
.combat-enemy {
  text-align:center; padding:20px; background:rgba(255,255,255,0.05);
  border-radius:var(--radius); width:100%; max-width:400px;
}
.combat-enemy .enemy-icon { font-size:3em; margin-bottom:8px; }
.combat-enemy .enemy-name { font-size:1.3em; font-weight:bold; color:var(--accent); }
.combat-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.combat-log { max-height:150px; overflow-y:auto; width:100%; max-width:500px; font-size:0.85em; background:rgba(0,0,0,0.3); padding:10px; border-radius:var(--radius); }

/* Buildings */
.building-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:8px; }
.building-card {
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px; cursor:pointer; transition:all 0.2s;
}
.building-card:hover { border-color:var(--accent2); }
.building-card.built { border-color:var(--green); background:rgba(34,197,94,0.05); }
.building-card .b-name { font-weight:bold; margin-bottom:4px; }
.building-card .b-desc { font-size:0.85em; color:var(--text2); }
.building-card .b-cost { font-size:0.8em; margin-top:6px; color:var(--yellow); }

/* Crafting */
.recipe-list { display:flex; flex-direction:column; gap:6px; }
.recipe-item {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  padding:10px 12px; cursor:pointer; transition:all 0.15s;
}
.recipe-item:hover { border-color:var(--accent2); }
.recipe-item .r-info { flex:1; }
.recipe-item .r-name { font-weight:bold; }
.recipe-item .r-cost { font-size:0.8em; color:var(--yellow); margin-top:2px; }
.recipe-item .r-btn {
  padding:6px 16px; border-radius:4px; font-size:0.85em;
  background:var(--accent2); color:#fff;
}

/* Fishing */
.fishing-area { text-align:center; padding:20px; }
.fishing-animation { font-size:3em; margin:20px 0; min-height:80px; }

/* Events / Modals */
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center;
  z-index:1000; padding:20px;
}
.modal-overlay.active { display:flex; }
.modal-box {
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:24px; max-width:500px; width:100%; max-height:80vh; overflow-y:auto;
}
.modal-box h3 { font-size:1.2em; margin-bottom:12px; color:var(--accent); }
.modal-box .modal-actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.modal-box .modal-actions button { flex:1; padding:10px; border-radius:6px; font-size:0.9em; }

/* Chest opening */
.chest-anim { text-align:center; font-size:4em; margin:20px 0; animation: chestBounce 0.5s ease; }
@keyframes chestBounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

/* Responsive */
@media(max-width:600px) {
  .status-bar { gap:4px; padding:6px 8px; font-size:0.8em; }
  .stat-bar-wrap { width:40px; }
  .time-info { font-size:0.75em; gap:6px; }
  .nav-tab { padding:8px 12px; font-size:0.8em; }
  .action-grid { grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); }
  .item-grid { grid-template-columns:repeat(auto-fill, minmax(85px,1fr)); }
  #title-screen h1 { font-size:2em; }
}

/* Professions & Skills display */
.prof-badge {
  display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.8em;
  background:var(--bg3); border:1px solid var(--accent2); margin:2px;
}
.skill-badge {
  display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.8em;
  background:rgba(168,85,247,0.15); border:1px solid var(--purple); margin:2px;
}

/* Save indicator */
.save-indicator {
  position:fixed; top:10px; right:10px; padding:4px 12px; border-radius:12px;
  font-size:0.75em; background:var(--green); color:#fff; opacity:0;
  transition:opacity 0.3s; z-index:999; pointer-events:none;
}
.save-indicator.show { opacity:1; }

/* Weather indicator */
.weather-badge { font-size:0.85em; }

/* Tabs for sub-pages */
.sub-tabs { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
.sub-tab {
  padding:6px 14px; border-radius:4px; font-size:0.85em;
  background:var(--bg); color:var(--text2); border:1px solid var(--border); cursor:pointer;
}
.sub-tab.active { background:var(--accent2); color:#fff; border-color:var(--accent2); }

/* Garden plot */
.garden-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(80px,1fr)); gap:6px; }
.garden-plot {
  aspect-ratio:1; background:var(--bg); border:1px solid var(--border); border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:0.8em; cursor:pointer; transition:all 0.2s; position:relative;
}
.garden-plot:hover { border-color:var(--green); }
.garden-plot .plot-icon { font-size:1.8em; }
.garden-plot .plot-timer { font-size:0.7em; color:var(--yellow); position:absolute; bottom:4px; }

/* Expand island */
.expand-section { text-align:center; padding:16px; }
.expand-section .island-size { font-size:1.5em; color:var(--accent2); margin-bottom:10px; }

/* Buff/Debuff Bar */
.buff-bar { display:flex; flex-wrap:wrap; gap:4px; padding:4px 12px; background:var(--bg); border-bottom:1px solid var(--border); min-height:24px; }
.buff-badge { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:10px; font-size:0.75em; white-space:nowrap; }
.buff-badge.buff { background:rgba(34,197,94,0.15); border:1px solid var(--green); color:var(--green); }
.buff-badge.debuff { background:rgba(239,68,68,0.15); border:1px solid var(--red); color:var(--red); }
.buff-badge.neutral { background:rgba(59,130,246,0.15); border:1px solid var(--blue); color:var(--blue); }
.buff-badge.profession { background:rgba(168,85,247,0.15); border:1px solid var(--purple); color:var(--purple); }

/* Durability Bar */
.dur-bar { width:100%; max-width:80px; height:4px; background:#333; border-radius:2px; margin-top:3px; }
.dur-bar-fill { height:100%; border-radius:2px; transition:width 0.3s; }
.dur-label { font-size:0.65em; color:var(--text2); margin-top:1px; }

/* Combat improvements */
.enemy-hp-bar { width:100px; height:8px; background:#333; border-radius:4px; margin:4px auto; overflow:hidden; }
.enemy-hp-fill { height:100%; background:var(--red); border-radius:4px; transition:width 0.3s; }
.dmg-number { position:absolute; font-weight:bold; font-size:1.2em; animation: dmgFloat 1s ease-out forwards; pointer-events:none; }
.dmg-number.player { color:var(--gold); }
.dmg-number.enemy { color:var(--red); }
.dmg-number.crit { color:var(--accent); font-size:1.5em; }
@keyframes dmgFloat { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }

/* Weather effect description */
.weather-desc { font-size:0.75em; color:var(--text2); margin-left:4px; }

/* Item tooltip on hover */
.item-card .item-dur { margin-top:2px; }

/* Yield preview */
.yield-preview { font-size:0.8em; color:var(--yellow); margin-top:4px; }

/* Affix system */
.affix-line { font-size:0.8em; padding:2px 0; }
.affix-prefix { color:var(--blue); }
.affix-suffix { color:var(--purple); }
.affix-tier-I { color:var(--text2); }
.affix-tier-II { color:var(--green); }
.affix-tier-III { color:var(--blue); }
.affix-tier-IV { color:var(--purple); }
.affix-tier-V { color:var(--gold); }
.item-affixes { margin:4px 0; padding:4px 6px; background:rgba(168,85,247,0.05); border-radius:4px; border-left:2px solid var(--purple); }
.equip-with-affix { position:relative; }
.equip-with-affix::after { content:'✦'; position:absolute; top:2px; right:2px; font-size:0.6em; color:var(--gold); }

/* Attribute allocation */
.attr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:8px 0; }
.attr-item { display:flex; align-items:center; gap:6px; padding:8px; background:var(--bg); border:1px solid var(--border); border-radius:6px; font-size:0.85em; }
.attr-item .attr-icon { font-size:1.3em; }
.attr-item .attr-name { font-weight:bold; min-width:32px; }
.attr-item .attr-val { color:var(--accent2); font-weight:bold; min-width:20px; text-align:center; }
.attr-item .attr-btn { width:24px; height:24px; border-radius:4px; background:var(--accent2); color:#fff; font-size:1em; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; }
.attr-item .attr-btn:disabled { opacity:0.3; cursor:default; }
.attr-item .attr-bonus { font-size:0.75em; color:var(--green); }
.free-points { text-align:center; padding:8px; background:rgba(233,69,96,0.1); border:1px solid var(--accent); border-radius:6px; margin:8px 0; font-weight:bold; }
.prof-grade-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.75em; margin-left:4px; }
.prof-grade-F { background:rgba(136,136,136,0.2); color:#888; border:1px solid #555; }
.prof-grade-C { background:rgba(168,85,247,0.15); color:var(--purple); border:1px solid var(--purple); }
.prof-grade-B { background:rgba(255,215,0,0.15); color:var(--gold); border:1px solid var(--gold); }
.prof-grade-A { background:rgba(249,115,22,0.15); color:var(--orange); border:1px solid var(--orange); }
.prof-grade-S { background:rgba(233,69,96,0.15); color:var(--accent); border:1px solid var(--accent); }

/* Fishing progress */
.fish-progress { width:100%; height:8px; background:#333; border-radius:4px; margin:10px 0; overflow:hidden; }
.fish-progress-fill { height:100%; background:var(--accent2); border-radius:4px; transition:width 0.3s; }

/* Equipped item with durability in status */
.equip-mini { display:flex; align-items:center; gap:4px; font-size:0.75em; padding:2px 6px; background:var(--bg); border:1px solid var(--border); border-radius:4px; }
.equip-mini .equip-dur { width:30px; height:3px; background:#333; border-radius:2px; }
.equip-mini .equip-dur-fill { height:100%; border-radius:2px; }

/* Cooking sub-tab */
.cooking-tab { border-left:3px solid var(--orange) !important; }

/* Achievement panel */
.ach-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:8px; }
.ach-card { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px; transition:all 0.2s; }
.ach-card.done { border-color:var(--green); background:rgba(34,197,94,0.08); }
.ach-card .ach-icon { font-size:1.5em; }
.ach-card .ach-name { font-weight:bold; font-size:0.9em; margin:4px 0; }
.ach-card .ach-desc { font-size:0.8em; color:var(--text2); }
.ach-card .ach-reward { font-size:0.75em; color:var(--gold); margin-top:4px; }
.ach-card .ach-check { color:var(--green); font-size:0.8em; margin-top:4px; }

/* Help panel */
.help-section { margin-bottom:16px; }
.help-section h4 { color:var(--accent2); margin-bottom:6px; font-size:0.95em; }
.help-section p, .help-section li { font-size:0.85em; color:var(--text2); line-height:1.6; }
.help-section ul { padding-left:20px; }

/* Quick action bar */
.quick-actions { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.quick-btn { padding:8px 14px; border-radius:6px; font-size:0.85em; background:var(--bg3); border:1px solid var(--border); color:var(--text); cursor:pointer; transition:all 0.15s; }
.quick-btn:hover { border-color:var(--accent2); background:#1a4a7a; }

// ============================================================
// GAME STATE
// ============================================================
const INITIAL_STATS = { hp:100, maxHp:100, hunger:100, water:100, mental:100, energy:200, maxEnergy:200, spirit:10 };
const INITIAL_ITEMS = {
  wood_rod:1
};

let G = null; // game state

    professions: [],

    talents: [],

    garden: [],
    islandSize: 100,
    defense: 0,
    // Legacy equip fields (kept for backward compat, read from equipment object)
    equippedWeapon: null,
    equippedArmor: null,
    equippedHead: null,
    equippedRod: null,
    equippedBait: null,
    pet: null,

}

// === Equipment & Player Classes (v2: matches Python architecture) ===
// Single source of truth for equipment. No more dual-sync.

const EquipSlot = {
  LEFT_HAND:'left_hand',   // 主手: 武器、工具、钓竿
  RIGHT_HAND:'right_hand', // 副手: 武器、工具、盾牌
  HEAD:'head',             // 头部: 头盔、帽子
  BODY:'body',             // 身体: 护甲、衣服
  BACK:'back',             // 背部: 背包、披风
  ACCESSORY:'accessory',   // 饰品: 戒指、项链
  BAIT:'bait'              // 钓饵: 专用槽位
};

const SLOT_NAMES = {
  left_hand:'主手', right_hand:'副手', head:'头部',
  body:'身体', back:'背部', accessory:'饰品', bait:'钓饵'
};

const SLOT_ICONS = {
  left_hand:'🤚', right_hand:'✋', head:'👑',
  body:'👕', back:'🎒', accessory:'💍', bait:'🪱'
};

class EquipItem {
  constructor(itemId, itemData, grade, durability) {
    this.itemId = itemId;
    this.itemData = itemData || {};
    this.grade = grade || (itemData && itemData.grade) || 'F';
    this.durability = durability != null ? durability : (itemData && itemData.durability) || -1;
    this.maxDurability = (itemData && itemData.durability) || -1;
    // 应用词条耐久加成
    this.applyAffixDurBonus();
  }
  get name() { return this.itemData.name || this.itemId; }
  get isBroken() { return this.durability === 0; }
  get atk() { return this.itemData.atk || 0; }
  get def() { return this.itemData.def || 0; }
  
  // 应用词条耐久加成
  applyAffixDurBonus() {
    if (typeof G !== 'undefined' && G.itemAffixes && G.itemAffixes[this.itemId]) {
      const affixes = G.itemAffixes[this.itemId];
      for (const a of affixes) {
        if (a.stat === 'durBonus' && this.maxDurability > 0) {
          const bonus = Math.floor(this.maxDurability * a.value / 100);
          this.maxDurability += bonus;
          this.durability += bonus;
        }
      }
    }
  }
  
  consumeDurability(amount) {
    if (this.durability < 0) return false;
    this.durability = Math.max(0, this.durability - (amount || 1));
    return this.durability <= 0;
  }
  toDict() {
    return { itemId: this.itemId, grade: this.grade, durability: this.durability };
  }
  static fromDict(d) {
    const def = getItemDef(d.itemId);
    if (!def) return null;
    return new EquipItem(d.itemId, def, d.grade, d.durability);
  }
}

class Equipment {
  constructor() {
    this.slots = {
      [EquipSlot.LEFT_HAND]: null,   // 主手: 武器、工具、钓竿
      [EquipSlot.RIGHT_HAND]: null,  // 副手: 武器、工具、盾牌
      [EquipSlot.HEAD]: null,        // 头部: 头盔
      [EquipSlot.BODY]: null,        // 身体: 护甲
      [EquipSlot.BACK]: null,        // 背部: 背包
      [EquipSlot.ACCESSORY]: null,   // 饰品
      [EquipSlot.BAIT]: null,        // 钓饵
    };
  }
  getMainHand() { return this.slots[EquipSlot.LEFT_HAND]; }
  getOffHand() { return this.slots[EquipSlot.RIGHT_HAND]; }
  getWeapon() { return this.slots[EquipSlot.LEFT_HAND]; }
  getArmor() { return this.slots[EquipSlot.BODY]; }
  getHelmet() { return this.slots[EquipSlot.HEAD]; }
  getAccessory() { return this.slots[EquipSlot.ACCESSORY]; }
  getBackpack() { return this.slots[EquipSlot.BACK]; }
  getRod() {
    const left = this.slots[EquipSlot.LEFT_HAND];
    if (left && left.itemData.tool_type === 'fishing') return left;
    const right = this.slots[EquipSlot.RIGHT_HAND];
    if (right && right.itemData.tool_type === 'fishing') return right;
    return null;
  }
  getBait() { return this.slots[EquipSlot.BAIT]; }
  getTool() {
    const left = this.slots[EquipSlot.LEFT_HAND];
    if (left && left.itemData.tool_type && left.itemData.tool_type !== 'fishing') return left;
    const right = this.slots[EquipSlot.RIGHT_HAND];
    if (right && right.itemData.tool_type && right.itemData.tool_type !== 'fishing') return right;
    return null;
  }

  equip(item, slot) {
    const old = this.slots[slot];
    this.slots[slot] = item;
    return old;
  }
  unequip(slot) {
    const item = this.slots[slot];
    this.slots[slot] = null;
    return item;
  }

  getTotalDef() {
    let total = 0;
    for (const item of Object.values(this.slots)) {
      if (item && !item.isBroken) total += (item.itemData.def || 0);
    }
    return total;
  }
  getTotalAtk() {
    let total = 0;
    const main = this.getMainHand();
    if (main && !main.isBroken) total += (main.itemData.atk || 0);
    const off = this.getOffHand();
    if (off && !off.isBroken) total += Math.floor((off.itemData.atk || 0) * 0.5);
    return total;
  }
  consumeWeaponDurability(amount) {
    const weapon = this.getMainHand();
    if (!weapon) return false;
    return weapon.consumeDurability(amount || 1);
  }
  consumeArmorDurability(amount) {
    const armor = this.getArmor();
    if (!armor) return false;
    return armor.consumeDurability(amount || 1);
  }
  toDict() {
    const d = {};
    for (const [slot, item] of Object.entries(this.slots)) {
      d[slot] = item ? item.toDict() : null;
    }
    return d;
  }
  static fromDict(d) {
    const eq = new Equipment();
    if (!d) return eq;
    for (const [slot, itemData] of Object.entries(d)) {
      if (itemData && itemData.itemId) {
        eq.slots[slot] = EquipItem.fromDict(itemData);
      }
    }
    return eq;
  }
  syncToLegacy() {
    if (!G) return;
    const main = this.getMainHand();
    G.equippedWeapon = main && main.itemData.type === 'weapon' ? main.itemId : null;
    G.equippedArmor = this.getArmor() ? this.getArmor().itemId : null;
    G.equippedHead = this.getHelmet() ? this.getHelmet().itemId : null;
    G.equippedRod = this.getRod() ? this.getRod().itemId : null;
    G.equippedBait = this.getBait() ? this.getBait().itemId : null;
    G.equippedTool = this.getTool() ? this.getTool().itemId : null;
  }
  syncFromLegacy() {
    const tryEquip = (itemId, slot) => {
      if (itemId) {
        const def = getItemDef(itemId);
        if (def) {
          const dur = G.toolDurability ? (G.toolDurability[itemId] != null ? G.toolDurability[itemId] : def.durability) : def.durability;
          this.slots[slot] = new EquipItem(itemId, def, def.grade, dur);
        }
      }
    };
    tryEquip(G.equippedWeapon, EquipSlot.LEFT_HAND);
    tryEquip(G.equippedArmor, EquipSlot.BODY);
    tryEquip(G.equippedHead, EquipSlot.HEAD);
    tryEquip(G.equippedRod, EquipSlot.LEFT_HAND);
    tryEquip(G.equippedBait, EquipSlot.BAIT);
    tryEquip(G.equippedTool, EquipSlot.LEFT_HAND);
  }
}

class Player {
  constructor(stats, equipment) {
    this.stats = stats || {};
    this.equipment = equipment || new Equipment();
  }
  get totalAtk() { return (this.stats.atk || 5) + this.equipment.getTotalAtk(); }
  get totalDef() { return (this.stats.defense || 0) + this.equipment.getTotalDef(); }
  get critChance() { return getPlayerCritChance(); }
  get critDamageMult() { return getPlayerCritDmg(); }
  toDict() {
    return { stats: { ...this.stats }, equipment: this.equipment.toDict() };
  }
  static fromDict(d) {
    const stats = d.stats || {};
    const equipment = Equipment.fromDict(d.equipment);
    return new Player(stats, equipment);
  }
}

// Migrate old save format to v2 (Equipment class)
function migrateToV2(data) {
  if (!data) return data;
  // If already has equipment with EquipItem format, no migration needed
  if (data.equipment && data.equipment.weapon && data.equipment.weapon.itemId) return data;
  // Migrate from legacy flat fields
  const eq = {};
  const tryMigrate = (itemId) => {
    if (!itemId) return null;
    const def = getItemDef(itemId);
    if (!def) return null;
    const dur = data.toolDurability ? (data.toolDurability[itemId] != null ? data.toolDurability[itemId] : def.durability) : def.durability;
    return { itemId, grade: def.grade || 'F', durability: dur != null ? dur : (def.durability || -1) };
  };
  data.equipment = {
    weapon: tryMigrate(data.equippedWeapon),
    body: tryMigrate(data.equippedArmor),
    head: tryMigrate(data.equippedHead),
    accessory: null,
    rod: tryMigrate(data.equippedRod),
    bait: tryMigrate(data.equippedBait),
    tool: tryMigrate(data.equippedTool),
  };
  return data;
}

// === Display Event System (v2: for future animation/graphic layer) ===
// Graphic layer subscribes to these events; text version ignores them.
const DisplayEvents = {
  _queue: [],
  emit(type, params, duration, blocking) {
    this._queue.push({ type, params: params||{}, duration: duration||0, blocking: blocking||false });
  },
  flush() { const q = this._queue; this._queue = []; return q; },
  // Shorthand methods
  fishingAnim(dur) { this.emit('play_anim', {anim:'fishing'}, dur||2.0, true); },
  combatAnim(atk) { this.emit('play_anim', {anim:'combat_'+(atk||'slash')}, 0.8, true); },
  showImage(img) { this.emit('show_image', {image:img}); },
  playSfx(sfx) { this.emit('play_sfx', {sfx:sfx}); },
  screenShake(intensity) { this.emit('shake', {intensity:intensity||0.5}, 0.3); },
  transitionFade(dur) { this.emit('transition', {style:'fade'}, dur||1.0, true); },
  showImage(img) { this.emit('show_image', {image:img}); },
};

// === DeterministicRandom (v2: for multiplayer state sync) ===
// Same seed = same sequence, ensuring all clients stay in sync.
class DeterministicRandom {
  constructor(seed) {
    this.seed = seed || 42;
    this.state = this.seed & 0xFFFFFFFF;
  }
  nextInt() {
    this.state ^= (this.state << 13) & 0xFFFFFFFF;
    this.state ^= (this.state >> 17);
    this.state ^= (this.state << 5) & 0xFFFFFFFF;
    return this.state;
  }
  nextFloat() { return this.nextInt() / 0xFFFFFFFF; }
  rangeInt(min, max) { return min + this.nextInt() % (max - min + 1); }
  choice(arr) { return arr[this.nextInt() % arr.length]; }
  chance(p) { return this.nextFloat() < p; }
  getState() { return { seed: this.seed, state: this.state }; }
  setState(s) { this.seed = s.seed; this.state = s.state; }
}

// === InputAction System (v2: for multiplayer sync) ===
// All player actions are wrapped as InputAction objects.
// Multiplayer sync only needs to send InputAction (small), not entire state.
const ActionType = {
  FISH:'fish', GATHER:'gather', USE_ITEM:'use_item', REST:'rest',
  CRAFT:'craft', BUILD:'build', PLANT:'plant', HARVEST:'harvest',
  EXPLORE:'explore', TRAVEL:'travel',
  ATTACK:'attack', DEFEND:'defend', USE_SKILL:'use_skill', FLEE:'flee',
  EQUIP:'equip', UNEQUIP:'unequip', ADVANCE_TIME:'advance_time',
};
function createInputAction(actionType, params) {
  return {
    playerId: G.playerId,
    action: actionType,
    params: params || {},
    timestamp: Date.now(),
  };
}
function submitAction(action) {
  // For now, process locally. In multiplayer, this would also send to server.
  DisplayEvents.emit('action_submitted', { action: action.action });
  // Action processing is handled by existing game functions
  // This wrapper exists for future network layer integration
  return true;
}

// ============================================================
// DISCARD ITEM
// ============================================================
function discardItem(idx) {
  const items = Object.keys(G.inventory);
  if (idx < 0 || idx >= items.length) return;
  const id = items[idx];
  const count = G.inventory[id];
  const name = getItemName(id);
  const qty = count > 1 ? parseInt(prompt(`丢弃${name}的数量？(1-${count})`) || '1') : 1;
  if (qty <= 0 || qty > count) return;
  if (!confirm(`确认丢弃 ${name} x${qty}？`)) return;
  G.inventory[id] -= qty;
  if (G.inventory[id] <= 0) delete G.inventory[id];
  addLog(`🗑️ 丢弃了 ${name} x${qty}`, 'system');
  renderInventory();
}

  for (const pid of G.professions) {
    const prof = PROFESSIONS[pid];
    if (!prof || !prof.attrBoosts) continue;
    for (const [attr, pct] of Object.entries(prof.attrBoosts)) {
      boosts[attr] = (boosts[attr]||0) + pct;
    }
  }
  return boosts;
}

// ATTRIBUTE & LEVELING SYSTEM (属性与升级系统)
// ============================================================
// 5 attributes: STR(力量), VIT(体质), DEX(敏捷), WIS(精神), CON(耐力)
// Each level: fixed stats from profession + free points to allocate
// No profession = 5 free points per level (no fixed stats)
const ATTRIBUTES = {
  str: {name:'力量', icon:'⚔️', desc:'每点+2攻击力', effect:'atk', value:2},
  vit: {name:'体质', icon:'❤️', desc:'每点+8最大HP', effect:'maxHp', value:8},

  wis: {name:'精神', icon:'🧠', desc:'每点+3最大精神', effect:'maxMental', value:3},
  con: {name:'耐力', icon:'💪', desc:'每点+5最大HP,饥饿/饮水消耗-1%', effect:'survival', value:5},
};

// Profession level-up bonuses: {fixed: {attr: amount}, freePoints: N}
const PROF_LEVEL_BONUS = {
  // No profession
  none:    {fixed:{}, freePoints:5},
  // F-grade basic professions
  guardian: {fixed:{vit:2, con:1}, freePoints:3},
  pioneer:  {fixed:{dex:1, con:2}, freePoints:3},
  smith:    {fixed:{str:1, vit:1, con:1}, freePoints:3},
  hunter:   {fixed:{str:2, dex:1}, freePoints:3},
  healer:   {fixed:{vit:1, wis:2}, freePoints:3},
  rogue:    {fixed:{dex:2, str:1}, freePoints:3},
  priest:   {fixed:{wis:2, vit:1}, freePoints:3},
  alchemist:{fixed:{wis:1, con:1, dex:1}, freePoints:3},
  berserker:{fixed:{str:2, vit:1}, freePoints:3},
  // C-grade mid professions
  necromancer: {fixed:{wis:2, str:1, vit:1}, freePoints:4},
  ranger:      {fixed:{dex:2, con:1, str:1}, freePoints:4},

};

// Get current profession grade
function getProfGrade() {
  if (!G.professions || G.professions.length === 0) return 'none';
  // Use the most recent/highest grade profession
  const grades = {void_sovereign:'S', paladin:'A', shadow_king:'A', skywalker:'B', enchanter:'B', commander:'B', necromancer:'C', ranger:'C', guardian:'F', pioneer:'F', smith:'F', hunter:'F', healer:'F', rogue:'F', priest:'F', alchemist:'F', berserker:'F'};
  let best = 'F';
  for (const p of G.professions) {
    const g = grades[p] || 'F';
    if (GRADE_ORDER.indexOf(g) < GRADE_ORDER.indexOf(best)) best = g;
  }
  // Return the profession with best grade
  for (const p of G.professions) {
    if ((grades[p]||'F') === best) return p;
  }
  return G.professions[G.professions.length-1];
}

const GRADE_ORDER = ['F','E','D','C','B','A','S','SS'];

// Level up - add fixed stats + free points
function getExpToNext(level) {
  // Level 1→2: 100, 2→3: 150, 3→4: 225, ... (×1.5 each level)
  // Cap at level 50 to prevent absurd numbers
  const lvl = Math.min(level, 50);
  return Math.floor(100 * Math.pow(1.5, lvl - 1));
}

function addExp(amount) {
  // 经验加成天赋
  amount = Math.floor(amount * getTalentMult('expMult', 1));
  G.playerExp = (G.playerExp || 0) + amount;
  addLog(`✨ 获得 ${amount} 经验值`, 'good');

  while (G.playerExp >= (G.expToNext || 100)) {
    G.playerExp -= G.expToNext;
    G.playerLevel = (G.playerLevel || 1) + 1;
    G.expToNext = getExpToNext(G.playerLevel);
    applyLevelUp();
  }
}

function applyLevelUp() {
  const profId = G.professions.length > 0 ? getProfGrade() : 'none';
  const bonus = PROF_LEVEL_BONUS[profId] || PROF_LEVEL_BONUS.none;

  // Apply fixed stats
  for (const [attr, amount] of Object.entries(bonus.fixed)) {
    if (!G.attrFixed) G.attrFixed = {};
    G.attrFixed[attr] = (G.attrFixed[attr]||0) + amount;
    applyAttrEffect(attr, amount);
  }

  // Add free points
  G.freePoints = (G.freePoints||0) + bonus.freePoints;

  // Heal on level up
  G.stats.hp = getPlayerMaxHp();
  G.stats.mental = Math.min(100, G.stats.mental + 10);

  const profName = profId === 'none' ? '无职业' : PROFESSIONS[profId]?.name || profId;
  const fixedText = Object.entries(bonus.fixed).map(([a,n])=>`${ATTRIBUTES[a].icon}${ATTRIBUTES[a].name}+${n}`).join(' ') || '无';
  addLog(`🎉 升级！Lv.${G.playerLevel} [${profName}] 固定:${fixedText} 自由点+${bonus.freePoints}`, 'good');
  showToast(`🎉 升级！Lv.${G.playerLevel}`, 'good');
  checkAchievements();
}

function levelUp() {
  // Legacy wrapper - now uses addExp
  addExp(G.expToNext || 100);
}

// Apply attribute effect
function applyAttrEffect(attr, amount) {
  const a = ATTRIBUTES[attr];
  if (!a) return;
  if (a.effect === 'maxHp') G.stats.maxHp += a.value * amount;
  if (a.effect === 'survival') G.stats.maxHp += a.value * amount;
}

// Get total max HP (base + level bonuses + affixes + profession boost)
function getPlayerMaxHp() {
  let hp = 100; // base
  hp += getEffectiveAttr('vit') * 8;
  hp += getEffectiveAttr('con') * 5;
  hp += getPlayerMaxHpBonus(); // from affixes
  return hp;
}

// Allocate free point to attribute
function allocatePoint(attr) {
  if (!G.freePoints || G.freePoints <= 0) return;
  if (!G.attrAllocated) G.attrAllocated = {};
  G.attrAllocated[attr] = (G.attrAllocated[attr]||0) + 1;
  G.freePoints--;
  applyAttrEffect(attr, 1);
  // HP increase needs immediate heal
  if (attr === 'vit' || attr === 'con') {
    G.stats.maxHp = getPlayerMaxHp();
    G.stats.hp = Math.min(G.stats.maxHp, G.stats.hp + 8);
  }
  renderInfo();
  renderStatusBar();
}

// Get total attribute value (fixed + allocated)
function getTotalAttr(attr) {
  return (G.attrFixed?.[attr]||0) + (G.attrAllocated?.[attr]||0);
}

// Get effective attribute value with profession boosts applied
function getEffectiveAttr(attr) {
  const base = getTotalAttr(attr);
  const boosts = getProfessionAttrBoosts();
  const boostPct = boosts[attr] || 0;
  return Math.floor(base * (1 + boostPct));
}

// Get profession boost percentage for display
function getAttrBoostPct(attr) {
  const boosts = getProfessionAttrBoosts();
  return boosts[attr] || 0;
}

// Apply attribute bonuses to combat
function applyAttrBonuses(baseValue, type) {
  if (type === 'atk') {
    return baseValue + getEffectiveAttr('str') * 2;
  }
  if (type === 'critPct') {
    return baseValue + getEffectiveAttr('dex') * 0.01;
  }
  return baseValue;
}

// Get hunger/water slow from CON (with profession boost)
function getConSlowBonus() {
  return getEffectiveAttr('con') * 0.01;
}

// Grade -> number of affixes
function getAffixCountForGrade(grade) {
  const ranges = {
    F:[0,1], E:[1,1], D:[1,2], C:[2,2], B:[2,3], A:[3,3], S:[3,4], SS:[4,4]
  };
  const r = ranges[grade] || [0,1];
  return r[0] + Math.floor(Math.random()*(r[1]-r[0]+1));
}

// Roll a random tier weighted toward lower tiers
function rollAffixTier() {
  const tiers = Object.keys(AFFIX_TIERS);
  const weights = tiers.map(t => AFFIX_TIERS[t].weight);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for (let i=0; i<tiers.length; i++) {
    r -= weights[i];
    if (r <= 0) return tiers[i];
  }
  return 'I';
}

// Generate affixes for an item
function generateAffixes(itemId, grade, bonusChance=0) {
  const def = getItemDef(itemId);
  if (!def) return [];
  // Only equipment gets affixes
  if (!['weapon','armor','tool'].includes(def.type)) return [];

  const count = getAffixCountForGrade(grade) + (Math.random()<bonusChance?1:0);
  if (count <= 0) return [];

  const slot = def.type === 'armor' ? (def.slot || 'body') : def.type;
  const prefixes = AFFIX_POOL.prefix.filter(a => a.types.includes(slot));
  const suffixes = AFFIX_POOL.suffix.filter(a => a.types.includes(slot));
  const allPool = [...prefixes.map(p=>({...p,affixType:'prefix'})), ...suffixes.map(s=>({...s,affixType:'suffix'}))];

  // Shuffle and pick unique affixes
  const shuffled = allPool.sort(()=>Math.random()-0.5);
  const chosen = [];
  const usedStats = new Set();

  for (const affix of shuffled) {
    if (chosen.length >= count) break;
    if (usedStats.has(affix.stat)) continue;
    usedStats.add(affix.stat);

    const tier = rollAffixTier();
    const tierMult = AFFIX_TIERS[tier].mult;
    const value = Math.floor(affix.base[0] + Math.random()*(affix.base[1]-affix.base[0]+1));
    const finalValue = Math.max(1, Math.floor(value * tierMult));

    chosen.push({
      id: affix.id,
      name: affix.name,
      stat: affix.stat,
      value: finalValue,
      tier: tier,
      affixType: affix.affixType,
      desc: affix.desc,
      icon: affix.icon,
    });
  }
  return chosen;
}

// Get all affix bonuses for an equipped item
function getAffixBonuses(itemId) {
  const bonuses = {};
  const affixes = G.itemAffixes ? G.itemAffixes[itemId] : null;
  if (!affixes) return bonuses;
  for (const a of affixes) {
    bonuses[a.stat] = (bonuses[a.stat]||0) + a.value;
  }
  return bonuses;
}

// Format affix display
function formatAffixes(itemId) {
  const affixes = G.itemAffixes ? G.itemAffixes[itemId] : null;
  if (!affixes || affixes.length === 0) return '';
  let html = '<div class="item-affixes">';
  for (const a of affixes) {
    const tierInfo = AFFIX_TIERS[a.tier];
    const cls = a.affixType === 'prefix' ? 'affix-prefix' : 'affix-suffix';
    html += `<div class="affix-line ${cls}">${a.icon} ${a.name} · ${a.desc}+${a.value} <span style="color:${tierInfo.color}">[${tierInfo.name}]</span></div>`;
  }
  html += '</div>';
  return html;
}

// Store affixes on newly created equipment
function storeAffixes(itemId, affixes) {
  if (!G.itemAffixes) G.itemAffixes = {};
  if (affixes.length > 0) {
    G.itemAffixes[itemId] = affixes;
    // 应用耐久加成词条
    applyDurBonusToItem(itemId);
  }
}

// 应用耐久加成词条到物品
function applyDurBonusToItem(itemId) {
  const affixes = G.itemAffixes ? G.itemAffixes[itemId] : null;
  if (!affixes) return;
  let durBonus = 0;
  for (const a of affixes) {
    if (a.stat === 'durBonus') durBonus += a.value;
  }
  if (durBonus <= 0) return;
  // 如果物品在背包中，增加其耐久上限
  if (G.toolDurability && G.toolDurability[itemId] !== undefined) {
    const def = getItemDef(itemId);
    if (def && def.durability) {
      const baseDur = def.durability;
      const newMaxDur = Math.floor(baseDur * (1 + durBonus / 100));
      // 如果当前耐久等于基础耐久，说明是新物品，设置为新上限
      if (G.toolDurability[itemId] >= baseDur) {
        G.toolDurability[itemId] = newMaxDur;
      }
    }
  }
}

// 获取物品的实际最大耐久（含词条加成）
function getItemMaxDurability(itemId) {
  const def = getItemDef(itemId);
  if (!def || !def.durability) return 0;
  let maxDur = def.durability;
  // 词条耐久加成
  const affixes = G.itemAffixes ? G.itemAffixes[itemId] : null;
  if (affixes) {
    for (const a of affixes) {
      if (a.stat === 'durBonus') {
        maxDur = Math.floor(maxDur * (1 + a.value / 100));
      }
    }
  }
  return maxDur;
}

// Reroll affixes (for smith skill)
function rerollAffixes(itemId) {
  const def = getItemDef(itemId);
  if (!def || !['weapon','armor','tool'].includes(def.type)) return;
  const grade = def.grade || 'F';
  const newAffixes = generateAffixes(itemId, grade, 0.2);
  storeAffixes(itemId, newAffixes);
  // 重新应用耐久加成到已装备的物品
  if (G.player) {
    const eq = G.player.equipment;
    for (const slot of Object.values(EquipSlot)) {
      const item = eq.slots[slot];
      if (item && item.itemId === itemId) {
        // 重置耐久为基础值
        item.maxDurability = def.durability || -1;
        item.durability = def.durability || -1;
        // 重新应用词条加成
        item.applyAffixDurBonus();
      }
    }
  }
  addLog(`🔨 重新锻造了${def.name}的词条！`, 'good');
}

  { id:'fragile', name:'脆弱', icon:'💔', grade:'F', desc:'防御-10%，但暴伤+40%', effects:{defMult:0.9,critDmgBonus:0.4} },
  { id:'slow', name:'迟钝', icon:'🐌', grade:'F', desc:'速度-10%，但HP回复+30%', effects:{speedMult:0.9,hpRegenMult:1.3} },
];

// 按等级权重随机选择3个天赋
function getRandomTalents(count=3) {
  const weighted = [];
  for (const t of START_TALENTS) {
    const w = TALENT_GRADE_WEIGHTS[t.grade] || 50;
    for (let i = 0; i < w; i++) weighted.push(t);
  }
  const chosen = [];
  const usedIds = new Set();
  while (chosen.length < count && chosen.length < START_TALENTS.length) {
    const t = weighted[Math.floor(Math.random() * weighted.length)];
    if (!usedIds.has(t.id)) { usedIds.add(t.id); chosen.push(t); }
  }
  return chosen;
}

function isDaytime() { return G.hour >= 6 && G.hour <= 18; }
function getTimeOfDay() { return isDaytime() ? '☀️ 白天' : '🌙 夜晚'; }
function getSafetyPhase() {
  if (G.day <= 7) return 'peace';
  if (G.day <= 15) return 'low';
  if (G.day <= 30) return 'medium';
  return 'high';
}

function getAttackChance() {
  const phase = getSafetyPhase();
  if (phase === 'peace') return 0;
  if (phase === 'low') return isDaytime() ? 0 : 0.25;
  if (phase === 'medium') return isDaytime() ? 0 : 0.5;
  return isDaytime() ? 0.3 : 0.7;
}

function addLog(msg, type='') {
  const panel = document.getElementById('log-panel');
  if (!panel) return;
  const div = document.createElement('div');
  div.className = 'log-entry ' + type;
  div.textContent = `[第${G.day}天 ${String(G.hour).padStart(2,'0')}:${String(G.minute||0).padStart(2,'0')}:${String(G.second||0).padStart(2,'0')}] ${msg}`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
  // Keep last 200 entries
  while (panel.children.length > 200) panel.removeChild(panel.firstChild);
}

function addInventoryItem(id, count=1) {
  if (!G.inventory[id]) G.inventory[id] = 0;
  G.inventory[id] += count;
  const def = getItemDef(id);
  const max = def && def.max_stack ? def.max_stack : 99;
  if (G.inventory[id] > max) G.inventory[id] = max;
}

function removeInventoryItem(id, count=1) {
  if (!G.inventory[id] || G.inventory[id] < count) return false;
  G.inventory[id] -= count;
  if (G.inventory[id] <= 0) delete G.inventory[id];
  return true;
}

function hasItem(id, count=1) { return (G.inventory[id]||0) >= count; }

// Auto-unequip broken items
function unequipBrokenItems() {
  if (!G.player) return;
  const eq = G.player.equipment;
  const slots = [EquipSlot.LEFT_HAND, EquipSlot.RIGHT_HAND, EquipSlot.HEAD, EquipSlot.BODY, EquipSlot.BACK];
  for (const slot of slots) {
    const item = eq.slots[slot];
    if (item && item.isBroken) {
      eq.unequip(slot);
      eq.syncToLegacy();
      addLog(`💔 ${item.name}已损坏，自动卸下`, 'warning');
    }
  }
}

function hasTool(toolType) {
  // Check equipped tool
  if (G.player) {
    const tool = G.player.equipment.getTool();
    if (tool && !tool.isBroken && tool.itemData.tool_type === toolType) return true;
  } else if (G.equippedTool) {
    const def = getItemDef(G.equippedTool);
    if (def && def.tool_type === toolType) return true;
  }
  // Check inventory for tools
  for (const [id, count] of Object.entries(G.inventory)) {
    if (count > 0) {
      const def = getItemDef(id);
      if (def && def.tool_type === toolType && def.type === 'tool') return true;
    }
  }
  return false;
}

function countItems() {
  let total = 0;
  for (const k in G.inventory) total += G.inventory[k];
  return total;
}

function applyTalentEffects() {
  // Reset derived
  G._talentEffects = {};
  if (G.chosenTalent) {
    const t = START_TALENTS.find(x=>x.id===G.chosenTalent);
    if (t) G._talentEffects = {...t.effects};
  }
}

function getTalentEffect(key, def=0) {
  return G._talentEffects ? (G._talentEffects[key]||def) : def;
}

function getTalentMult(key, def=1) {
  return G._talentEffects ? (G._talentEffects[key]||def) : def;
}

function hasProfession(id) { return G.professions.includes(id); }

function professionBonus(type) {
  let mult = 1;
  if (type==='defense' && hasProfession('guardian')) mult += 0.25;
  if (type==='monster_dmg_reduce' && hasProfession('guardian')) mult -= 0.18;
  if (type==='rare_resource' && hasProfession('pioneer')) mult += 0.20;
  if (type==='expand_cost' && hasProfession('pioneer')) mult -= 0.15;
  if (type==='craft_success' && hasProfession('smith')) mult += 0.22;
  if (type==='resource_loss' && hasProfession('smith')) mult -= 0.20;
  if (type==='move_speed' && hasProfession('hunter')) mult += 0.12;
  if (type==='void_dmg' && hasProfession('hunter')) mult += 0.20;
  if (type==='hp_regen' && hasProfession('healer')) mult += 0.30;
  if (type==='mental_regen' && hasProfession('healer')) mult += 0.30;
  if (type==='void_resist' && hasProfession('skywalker')) mult -= 0.50;
  if (type==='explore_debuff' && hasProfession('skywalker')) mult -= 0.50;
  return Math.max(0, mult);
}

function tickSurvival() {
  // Activity-based hunger/water decay multiplier
  let activityMult = 1;
  if (G.currentActivity === 'gathering') activityMult = 1.3;
  else if (G.currentActivity === 'exploring') activityMult = 1.2;
  else if (G.currentActivity === 'combat') activityMult = 1.5;
  else if (G.currentActivity === 'fishing') activityMult = 0.8;

  // Hunger decay
  let hungerDecay = 1.5 * getTalentMult('hunger_decay_mult',1) * professionBonus('resource_loss') * activityMult;
  let waterDecay = 1.8 * getTalentMult('thirst_decay_mult',1) * activityMult;
  // CON attribute: reduce hunger/water decay
  const conSlow = getConSlowBonus();
  hungerDecay *= (1 - conSlow);
  waterDecay *= (1 - conSlow);
  // 词条饥饿/饮水减缓
  const allBonuses = getAllAffixBonuses();
  hungerDecay *= (1 - (allBonuses.hungerSlow || 0) / 100);
  waterDecay *= (1 - (allBonuses.waterSlow || 0) / 100);

  // Weather effects on decay
  if (G.weather === 'cold') hungerDecay *= 1.5;
  if (G.weather === 'stormy') { hungerDecay *= 1.2; waterDecay *= 1.2; }

  G.stats.hunger = Math.max(0, G.stats.hunger - hungerDecay);
  G.stats.water = Math.max(0, G.stats.water - waterDecay);

  // Mental decay (slower)
  let mentalDecay = 0.3;
  // Weather mental effects
  if (G.weather === 'rainy') mentalDecay += 0.5;
  if (G.weather === 'stormy') mentalDecay += 1.0;
  // Night drains mental faster
  if (!isDaytime()) mentalDecay += 0.4;
  // Mental resist from talent
  if (getTalentEffect('weather_resist',0) > 0) mentalDecay *= (1 - getTalentEffect('weather_resist',0));
  // 精神消耗天赋
  mentalDecay *= getTalentMult('mentalDecayMult', 1);
  G.stats.mental = Math.max(0, G.stats.mental - mentalDecay);

  // HP drain from hunger/water at 0
  if (G.stats.hunger <= 0) {
    G.stats.hp -= 3;
    addLog('⚠️ 饱食度为0！生命值-3', 'warning');
  }
  if (G.stats.water <= 0) {
    G.stats.hp -= 4;
    addLog('⚠️ 饮水为0！生命值-4', 'warning');
  }

  // Mental at 0: hallucinations
  if (G.stats.mental <= 0 && Math.random() < 0.3) {
    addLog('🌀 精神崩溃！你产生了幻觉...', 'warning');
  }

  // Natural regen (if well-fed)
  let hpRegen = 0;
  if (G.stats.hunger > 50 && G.stats.water > 50) hpRegen = 1;
  hpRegen *= professionBonus('hp_regen');
  hpRegen *= getTalentMult('mental_regen_mult',1);
  if (hasProfession('healer')) hpRegen *= 1.3;
  // 词条HP回复（直接加值，不除100）
  const allBonusesForRegen = getAllAffixBonuses();
  hpRegen += (allBonusesForRegen.hpRegen || 0);
  G.stats.hp = Math.min(G.stats.maxHp, G.stats.hp + hpRegen);

  // Mental regen if safe
  if (isDaytime() && G.stats.hunger > 30 && G.stats.water > 30) {
    let mentalRegen = 0.5 * professionBonus('mental_regen');
    if (G.weather === 'sunny') mentalRegen += 0.2; // Sunny bonus
    G.stats.mental = Math.min(100, G.stats.mental + mentalRegen);
  }

  // Stormy weather: random building damage
  if (G.weather === 'stormy' && Math.random() < 0.05) {
    const builtKeys = Object.keys(G.buildings);
    if (builtKeys.length > 0) {
      const target = builtKeys[Math.floor(Math.random()*builtKeys.length)];
      addLog(`⚠️ 暴风雨损坏了${BUILDING_DEFS[target]?.name || target}！`, 'warning');
    }
  }

  // Reset activity
  G.currentActivity = 'idle';

  // Cap stats
  G.stats.hp = Math.max(0, Math.min(G.stats.maxHp, G.stats.hp));
  G.stats.hunger = Math.max(0, Math.min(100, G.stats.hunger));
  G.stats.water = Math.max(0, Math.min(100, G.stats.water));
  G.stats.mental = Math.max(0, Math.min(100, G.stats.mental));
}

function advanceTime(hours=1) {
  for (let i = 0; i < hours; i++) {
    G.hour++;
    G.totalTurns++;
    if (G.hour >= 24) {
      G.hour = 0;
      G.day++;
      addLog(`📅 新的一天！第${G.day}天开始了。`, 'system');
      // Daily events
      checkDailyEvents();
    }
    tickSurvival();
    updateWeather();
    checkDisasters();
    updateGarden();
    // Auto save every 50 turns
    if (G.totalTurns - G.lastAutoSave >= 50) {
      saveGame();
      G.lastAutoSave = G.totalTurns;
    }
  }
  // Check death
  if (G.stats.hp <= 0) {
    gameOver();
    return;
  }
  checkRandomEncounter();
  checkAchievements();
  renderAll();
}

function checkDailyEvents() {
  // Weather change
  if (G.weatherTimer <= 0) {
    const weathers = Object.keys(GAME_DATA.gameplay.weather_types);
    G.weather = weathers[Math.floor(Math.random() * weathers.length)];
    const wt = GAME_DATA.gameplay.weather_types[G.weather];
    G.weatherTimer = wt.duration ? (wt.duration[0] + Math.floor(Math.random()*(wt.duration[1]-wt.duration[0]+1))) : 2;
    if (G.weather !== 'sunny') addLog(`🌤️ 天气变化：${wt.name}`, 'system');
  }
  G.weatherTimer--;

  // Building effects
  if (G.buildings.water_well) {
    addInventoryItem('freshwater', 2);
    addLog('💧 深水井产出2份淡水', 'good');
  }
  if (G.buildings.medical_tent) {
    G.stats.hp = Math.min(G.stats.maxHp, G.stats.hp + 5);
    addLog('💚 医疗帐恢复5点HP', 'good');
  }
}

function checkDisasters() {
  const disasters = GAME_DATA.gameplay.disaster_types;
  if (!G.lastDisasterDay) G.lastDisasterDay = {};
  for (const d of disasters) {
    const interval = d.id === 'rat_swarm' ? 7 : d.id === 'wolf_pack' ? 14 : d.id === 'goblin_raid' ? 14 : d.id === 'undead_tide' ? 30 : 60;
    const lastDay = G.lastDisasterDay[d.id] || 0;
    if (G.day >= d.min_day && G.day >= lastDay + interval && G.hour === 0) {
      G.lastDisasterDay[d.id] = G.day;
      triggerDisaster(d);
    }
  }
}

function triggerDisaster(disaster) {
  addLog(`⚠️ 灾难来袭：${disaster.name}！`, 'combat');
  // Scale enemies with day number
  const dayScale = 1 + Math.floor(G.day / 30) * 0.3;
  const enemies = [];
  for (const c of disaster.creatures) {
    const creatureDef = getCreatureDef(c.id);
    if (creatureDef) {
      const count = c.count[0] + Math.floor(Math.random()*(c.count[1]-c.count[0]+1));
      for (let i=0; i<count; i++) {
        const scaled = {...creatureDef};
        scaled.hp = Math.floor(scaled.hp * dayScale);
        scaled.atk = Math.floor((scaled.atk || 5) * dayScale);
        enemies.push(scaled);
      }
    }
  }
  if (enemies.length > 0) {
    startCombat(enemies, true);
    if (combatState) combatState.disasterName = disaster.name;
  }
}

function getCreatureDef(id) {
  const all = [...GAME_DATA.creatures.wild_beasts, ...GAME_DATA.creatures.island_guardians];
  return all.find(c => c.id === id) || null;
}

let combatState = null;

function startCombat(enemies, isDisaster=false) {
  combatState = {
    enemies: enemies.map((e,i) => ({
      ...e, currentHp: e.hp, index: i, maxHp: e.hp,
      poisoned: false, poisonTurns: 0, stunned: false
    })),
    turn: 0,
    playerTurn: true,
    log: [],
    isDisaster,
    tempDefMult: 1,
    dodgeBonus: 0,
    tauntActive: false,
    guaranteedCrit: false,
    firstStrike: false,
    pendingDmg: 0,
    doubleHarvest: false,
    freeCraft: false,
    qualityUp: false,
    exploreBonus: 0,
    clearDebuffs: false,
  };

  // Apply skill buffs
  if (G.skillCooldowns) {
    for (const sid in G.skillCooldowns) {
      if (G.skillCooldowns[sid] > 0) continue;
      const skill = SKILLS[sid];
      if (skill && skill.type === 'active') {
        // Check for pre-combat skills
      }
    }
  }

  if (combatState.firstStrike) {
    combatState.playerTurn = true;
    addLog('⚡ 先手攻击！', 'combat');
  }
  // 词条速度加成影响先手
  const allBonusesForSpeed = getAllAffixBonuses();
  if ((allBonusesForSpeed.speed || 0) > 0 && Math.random() < (allBonusesForSpeed.speed || 0) / 100) {
    combatState.playerTurn = true;
    addLog('⚡ 速度优势！先手攻击！', 'combat');
  }

  renderCombat();
}

// 获取所有装备的词条总加成
function getAllAffixBonuses() {
  const total = {};
  const slots = [G.equippedWeapon, G.equippedArmor, G.equippedHead, G.equippedTool, G.equippedRod];
  for (const id of slots) {
    if (!id) continue;
    const b = getAffixBonuses(id);
    for (const [k,v] of Object.entries(b)) {
      if (v) total[k] = (total[k]||0) + v;
    }
  }
  return total;
}

function calcPlayerAtk() {
  let atk = G.stats.atk || 5;
  const allBonuses = getAllAffixBonuses();
  // 武器基础攻击
  const weapon = G.player ? G.player.equipment.getWeapon() : null;
  if (weapon && !weapon.isBroken) {
    atk += weapon.atk;
  } else if (G.equippedWeapon) {
    const wdef = getItemDef(G.equippedWeapon);
    if (wdef) atk += wdef.atk || 0;
  }
  // 词条攻击加成
  atk += allBonuses.atk || 0;
  atk += allBonuses.fireDmg || 0;
  atk += allBonuses.iceDmg || 0;
  atk += allBonuses.voidDmg || 0;
  atk += allBonuses.armorPen || 0;
  // STR attribute bonus
  atk += getEffectiveAttr('str') * 2;
  // 天赋加成
  atk *= getTalentMult('allStatsMult', 1);
  atk *= getTalentMult('atkMult', 1);
  atk *= getTalentMult('weapon_dmg_mult', 1);
  // 元素伤害天赋
  atk += getTalentEffect('fireDmg', 0);
  atk += getTalentEffect('iceDmg', 0);
  atk += getTalentEffect('voidDmgBonus', 0);
  atk += getTalentEffect('darkDmg', 0);
  atk += getTalentEffect('lightDmg', 0);
  atk += getTalentEffect('lightningDmg', 0);
  atk += getTalentEffect('chaosDmg', 0);
  atk += getTalentEffect('shadowDmg', 0);
  if (!isDaytime()) atk *= (1 + getTalentEffect('nightAtkMult', 0));
  if (G.weather === 'stormy') atk *= (1 + getTalentEffect('stormAtkMult', 0));
  if (hasProfession('hunter')) atk *= 1.2;
  return Math.floor(atk);
}

function getPlayerCritChance() {
  let cc = 0.05;
  cc += getEffectiveAttr('dex') * 0.01;
  cc += getTalentEffect('critBonus', 0);
  // 词条暴击加成（所有装备）
  const allBonuses = getAllAffixBonuses();
  cc += (allBonuses.critPct || 0) / 100;
  return Math.min(0.8, cc);
}

function getPlayerCritDmg() {
  let cd = 1.8;
  cd += getTalentEffect('critDmgBonus', 0);
  // 词条暴击伤害加成（所有装备）
  const allBonuses = getAllAffixBonuses();
  cd += (allBonuses.critDmg || 0) / 100;
  return cd;
}

function getPlayerLifesteal() {
  let ls = 0;
  ls += getTalentEffect('lifesteal', 0);
  // 词条吸血加成（所有装备）
  const allBonuses = getAllAffixBonuses();
  ls += (allBonuses.lifesteal || 0) / 100;
  return ls;
}

function getPlayerDodgeBonus() {
  let dodge = 0;
  dodge += getTalentEffect('dodgePct', 0);
  // 词条闪避加成（所有装备）
  const allBonuses = getAllAffixBonuses();
  dodge += (allBonuses.dodgePct || 0) / 100;
  return dodge;
}

function getPlayerMaxHpBonus() {
  // 词条HP加成（所有装备）
  const allBonuses = getAllAffixBonuses();
  return allBonuses.maxHp || 0;
}

function getPlayerMaxHp() {
  let hp = G.stats.maxHp || 100;
  hp *= getTalentMult('maxHpMult', 1);
  hp += getPlayerMaxHpBonus();
  return Math.floor(hp);
}

// 获取最大精神值（含词条加成）
function getMaxMental() {
  let maxMental = 100;
  const allBonuses = getAllAffixBonuses();
  maxMental += allBonuses.maxMental || 0;
  return maxMental;
}

function calcPlayerDef() {
  let def = 0;
  if (G.player) {
    def = G.player.equipment.getTotalDef();
  } else {
    if (G.equippedArmor) {
      const adef = getItemDef(G.equippedArmor);
      if (adef) def += adef.def || 0;
    }
    if (G.equippedHead) {
      const hdef = getItemDef(G.equippedHead);
      if (hdef) def += hdef.def || 0;
    }
  }
  // 词条防御加成（所有装备）
  const allBonuses = getAllAffixBonuses();
  def += allBonuses.def || 0;
  def += allBonuses.dmgReduce || 0;
  def += allBonuses.buildDef || 0;
  def += getTalentEffect('defense', 0);
  def *= getTalentMult('defMult', 1);
  def += Math.floor(def * getTalentEffect('dmgReduce', 0));
  def += Math.floor(def * getTalentEffect('allResist', 0));
  if (hasProfession('guardian')) def *= 1.25;
  if (combatState) def *= combatState.tempDefMult || 1;
  return Math.floor(def);
}

function playerAttack(targetIndex) {
  if (!combatState || !combatState.playerTurn) return;
  const target = combatState.enemies[targetIndex];
  if (!target || target.currentHp <= 0) return;

  // Check if weapon is broken
  unequipBrokenItems();
  if (G.player) {
    const weapon = G.player.equipment.getWeapon();
    if (weapon && weapon.isBroken) {
      addLog('❌ 武器已损坏！', 'warning');
      return;
    }
  }

  combatState.turn++;
  let atk = calcPlayerAtk();
  // 狂战士被动加成
  if (combatState.berserkerAtkBoost) {
    atk = Math.floor(atk * combatState.berserkerAtkBoost);
  }
  let critChance = getPlayerCritChance() + (combatState.guaranteedCrit ? 0.9 : 0);
  let isCrit = Math.random() < critChance;
  let critMult = getPlayerCritDmg();
  if (isCrit) atk = Math.floor(atk * critMult);

  // Mental miss chance
  let missChance = G.stats.mental <= 0 ? 0.4 : (G.stats.mental < 20 ? 0.15 : 0);
  // 词条命中加成
  const allBonusesForAtk = getAllAffixBonuses();
  missChance *= (1 - (allBonusesForAtk.acc || 0) / 100);
  if (Math.random() < missChance) {
    combatState.log.push(`你因精神恍惚，攻击落空了！`);
    addLog('🌀 攻击落空！（精神过低）', 'combat');
  } else {
    const def = target.def || 0;
    let dmg = Math.max(1, atk - def);
    // Guardian monster dmg reduction
    if (hasProfession('guardian')) dmg = Math.floor(dmg * 1.18);
    target.currentHp -= dmg;
    const critText = isCrit ? ' 💥暴击！' : '';
    combatState.log.push(`你攻击${target.name}，造成${dmg}点伤害！${critText}`);
    addLog(`⚔️ 攻击${target.name}，${dmg}伤害${critText}`, 'combat');

    // v2: Lifesteal from weapon affixes + skills (matches Python combat)
    let lifesteal = getPlayerLifesteal();
    if (hasSkill('lifesteal')) lifesteal += 0.15;
    if (lifesteal > 0) {
      const heal = Math.floor(dmg * lifesteal);
      G.stats.hp = Math.min(G.stats.maxHp, G.stats.hp + heal);
      if (heal > 0) combatState.log.push(`吸取${heal}点生命！`);
    }

    // v2: Weapon durability via Equipment class (matches Python combat)
    if (G.player) {
      const broken = G.player.equipment.consumeWeaponDurability(1);
      if (broken) {
        const weapon = G.player.equipment.getWeapon();
        addLog(`💔 ${weapon ? weapon.name : '武器'}损坏了！`, 'warning');
        unequipBrokenItems();
      }
    } else if (G.equippedWeapon && G.toolDurability[G.equippedWeapon] != null) {
      G.toolDurability[G.equippedWeapon]--;
      if (G.toolDurability[G.equippedWeapon] <= 0) {
        addLog(`💔 ${getItemName(G.equippedWeapon)}损坏了！`, 'warning');
        G.equippedWeapon = null;
      }
    }
  }

  combatState.guaranteedCrit = false;
  if (target.currentHp <= 0) {
    combatState.log.push(`${target.name}被击败了！`);
    addLog(`💀 ${target.name}被击败！`, 'good');
    G.killCount++;
    // Grant EXP based on enemy strength
    const enemyExp = Math.max(5, Math.floor((target.maxHp || 10) * 0.5 + (target.atk || 3) * 2 + (target.reward_exp || 10)));
    addExp(enemyExp);
  }

  // Random combat events
  checkCombatEvent();

  // Enemy turn
  combatState.playerTurn = false;
  setTimeout(() => enemyTurn(), 500);
  renderCombat();
}

function playerDefend() {
  if (!combatState || !combatState.playerTurn) return;
  combatState.turn++;
  combatState.tempDefMult = (combatState.tempDefMult||1) * 2;
  combatState.log.push('你举起防御，本回合防御翻倍！');
  addLog('🛡️ 防御姿态！', 'system');
  combatState.playerTurn = false;
  setTimeout(() => enemyTurn(), 500);
  renderCombat();
}

function playerUseItem(itemId) {
  if (!combatState || !combatState.playerTurn) return;
  if (!hasItem(itemId)) return;

  const def = getItemDef(itemId);
  if (!def) return;

  removeInventoryItem(itemId);
  combatState.turn++;

  if (def.heal) {
    G.stats.hp = Math.min(G.stats.maxHp, G.stats.hp + def.heal);
    combatState.log.push(`使用${def.name}，恢复${def.heal}HP！`);
    addLog(`💚 使用${def.name}，HP+${def.heal}`, 'good');
  }
  if (def.hunger_restore) {
    G.stats.hunger = Math.min(100, G.stats.hunger + def.hunger_restore);
    combatState.log.push(`食用${def.name}，饱食度+${def.hunger_restore}！`);
  }
  if (def.water_restore) {
    G.stats.water = Math.min(100, G.stats.water + def.water_restore);
    combatState.log.push(`饮用${def.name}，饮水+${def.water_restore}！`);
  }
  if (def.mana_restore) {
    // MP system not used in this version, treat as mental restore
    G.stats.mental = Math.min(100, G.stats.mental + def.mana_restore);
    combatState.log.push(`使用${def.name}，精神+${def.mana_restore}！`);
  }

  combatState.playerTurn = false;
  setTimeout(() => enemyTurn(), 500);
  renderCombat();
  renderInventory();
}

function playerFlee() {
  if (!combatState || !combatState.playerTurn) return;
  combatState.turn++;
  let fleeChance = 0.4 + (hasProfession('hunter') ? 0.12 : 0) + getTalentEffect('flee_bonus', 0);
  // 词条逃跑率加成
  const allBonusesForFlee = getAllAffixBonuses();
  fleeChance += (allBonusesForFlee.fleeBonus || 0) / 100;
  if (combatState.isDisaster) fleeChance -= 0.2;
  if (Math.random() < fleeChance) {
    addLog('🏃 逃跑成功！', 'system');
    combatState = null;
    hideCombat();
    renderAll();
  } else {
    combatState.log.push('逃跑失败！');
    addLog('❌ 逃跑失败！', 'warning');
    combatState.playerTurn = false;
    setTimeout(() => enemyTurn(), 500);
  }
  renderCombat();
}

function useCombatSkill(skillId) {
  if (!combatState || !combatState.playerTurn) return;
  const skill = SKILLS[skillId];
  if (!skill || skill.type !== 'active') return;
  if (!hasSkill(skillId)) return;
  if (G.skillCooldowns[skillId] && G.skillCooldowns[skillId] > 0) {
    addLog('⏳ 技能冷却中！', 'warning');
    return;
  }

  const result = skill.effect(combatState);
  combatState.log.push(`【${skill.name}】${result}`);
  addLog(`✨ ${skill.name}：${result}`, 'good');
  G.skillCooldowns[skillId] = skill.cooldown;

  combatState.turn++;
  combatState.playerTurn = false;
  setTimeout(() => enemyTurn(), 500);
  renderCombat();
}

function enemyTurn() {
  if (!combatState) return;
  const alive = combatState.enemies.filter(e => e.currentHp > 0);
  if (alive.length === 0) {
    combatVictory();
    return;
  }

  // 狂战士天赋: HP每损失10%攻击+X%
  const berserkerBonus = getTalentEffect('berserkerAtkPer10Pct', 0);
  if (berserkerBonus > 0) {
    const hpLostPct = 1 - (G.stats.hp / (G.stats.maxHp || 100));
    const atkBoost = 1 + Math.floor(hpLostPct * 10) * berserkerBonus;
    combatState.berserkerAtkBoost = atkBoost;
  }

  for (const enemy of alive) {
    if (enemy.stunned) { enemy.stunned = false; continue; }

    let atk = enemy.atk || 5;
    if (hasProfession('guardian')) atk = Math.floor(atk * 0.82);
    if (combatState.tauntActive) atk = Math.floor(atk * 0.7);

    let def = calcPlayerDef();
    let dmg = Math.max(1, atk - def);

    // 格挡天赋
    const blockChance = getTalentEffect('blockChance', 0);
    if (blockChance > 0 && Math.random() < blockChance) {
      dmg = Math.floor(dmg * 0.5);
      combatState.log.push(`你格挡了${enemy.name}的攻击，伤害减半！`);
      addLog(`🛡️ 格挡！伤害减半`, 'good');
    }

    // Dodge
    let dodgeChance = combatState.dodgeBonus || 0;
    dodgeChance += getPlayerDodgeBonus();
    if (Math.random() < dodgeChance) {
      combatState.log.push(`${enemy.name}攻击你，但你闪避了！`);
      addLog(`💨 闪避了${enemy.name}的攻击！`, 'good');
      continue;
    }

    // 元素抗性天赋
    if (enemy.name.includes('虚空')) {
      dmg = Math.floor(dmg * (1 - getTalentEffect('void_resist', 0)));
      // 词条虚空抗性
      const allBonusesForResist = getAllAffixBonuses();
      dmg = Math.floor(dmg * (1 - (allBonusesForResist.voidRes || 0) / 100));
      if (hasProfession('skywalker')) dmg = Math.floor(dmg * 0.5);
    }
    if (enemy.name.includes('火')) dmg = Math.floor(dmg * (1 - getTalentEffect('fireResist', 0)));
    if (enemy.name.includes('冰')) dmg = Math.floor(dmg * (1 - getTalentEffect('iceResist', 0)));
    if (enemy.name.includes('暗')) dmg = Math.floor(dmg * (1 - getTalentEffect('darkResist', 0)));
    dmg = Math.floor(dmg * (1 - getTalentEffect('elementResist', 0)));
    dmg = Math.floor(dmg * (1 - getTalentEffect('allResist', 0)));

    // 伤害减免天赋
    dmg = Math.floor(dmg * (1 - getTalentEffect('dmgReduce', 0)));

    G.stats.hp -= dmg;
    combatState.log.push(`${enemy.name}攻击你，造成${dmg}点伤害！`);
    addLog(`🩸 ${enemy.name}对你造成${dmg}伤害`, 'combat');

    // v2: Armor durability via Equipment class (matches Python combat._enemy_turn)
    if (G.player) {
      const broken = G.player.equipment.consumeArmorDurability(1);
      if (broken) {
        const armor = G.player.equipment.getArmor();
        addLog(`💔 ${armor ? armor.name : '护甲'}损坏了！`, 'warning');
        unequipBrokenItems();
      }
    } else if (G.equippedArmor && G.toolDurability[G.equippedArmor] != null) {
      G.toolDurability[G.equippedArmor]--;
      if (G.toolDurability[G.equippedArmor] <= 0) {
        addLog(`💔 ${getItemName(G.equippedArmor)}损坏了！`, 'warning');
        G.equippedArmor = null;
      }
    }

    // Poison body talent
    if (getTalentEffect('poison_on_hit_chance', 0) > 0 && Math.random() < 0.3) {
      enemy.poisoned = true;
      enemy.poisonTurns = 3;
      combatState.log.push(`毒素感染了${enemy.name}！`);
    }

    // Counter attack
    if (getTalentEffect('counter_chance', 0) > 0 && Math.random() < 0.4) {
      const counterDmg = Math.floor(calcPlayerAtk() * 0.8);
      enemy.currentHp -= counterDmg;
      combatState.log.push(`反击！对${enemy.name}造成${counterDmg}伤害！`);
    }
  }

  // Poison tick on enemies
  for (const enemy of alive) {
    if (enemy.poisoned && enemy.poisonTurns > 0) {
      const poisonDmg = Math.floor(enemy.maxHp * 0.05);
      enemy.currentHp -= poisonDmg;
      enemy.poisonTurns--;
      if (enemy.poisonTurns <= 0) enemy.poisoned = false;
      combatState.log.push(`${enemy.name}受到${poisonDmg}毒素伤害`);
    }
  }

  // Taunt countdown
  if (combatState.tauntActive) {
    combatState.tauntTurns--;
    if (combatState.tauntTurns <= 0) combatState.tauntActive = false;
  }

  // Def mult reset
  combatState.tempDefMult = 1;

  // Skill cooldowns
  for (const sid in G.skillCooldowns) {
    if (G.skillCooldowns[sid] > 0) G.skillCooldowns[sid]--;
  }

  // Check player death
  if (G.stats.hp <= 0) {
    gameOver();
    return;
  }

  // Check all enemies dead
  const stillAlive = combatState.enemies.filter(e => e.currentHp > 0);
  if (stillAlive.length === 0) {
    combatVictory();
    return;
  }

  combatState.playerTurn = true;
  renderCombat();
}

function combatVictory() {
  if (!combatState) return;
  let exp = 0;
  let lootText = [];

  // 击杀回复天赋
  const killHealPct = getTalentEffect('killHealPct', 0);
  if (killHealPct > 0) {
    const heal = Math.floor((G.stats.maxHp || 100) * killHealPct);
    G.stats.hp = Math.min(G.stats.maxHp || 100, G.stats.hp + heal);
    addLog(`💚 击杀回复${heal}HP`, 'good');
  }

  for (const enemy of combatState.enemies) {
    exp += enemy.reward_exp || 10;
    // Drop loot
    const drops = generateCombatLoot(enemy);
    for (const [itemId, count] of drops) {
      addInventoryItem(itemId, count);
      lootText.push(`${getItemName(itemId)} x${count}`);
    }
  }

  // Disaster bonus drops
  if (combatState.isDisaster) {
    G._survivedDisaster = true;
    // Disaster-specific materials
    const disasterMats = {
      '虚空之风': ['wind_essence', 2],
      '虚空雷暴': ['thunder_stone', 2],
      '虚空风暴潮': ['storm_crystal', 1],
      '混沌潮汐': ['chaos_core', 1],
    };
    const disName = combatState.disasterName || '';
    let bonusGiven = false;
    for (const [name, [item, count]] of Object.entries(disasterMats)) {
      if (disName.includes(name)) {
        addInventoryItem(item, count);
        lootText.push(`${getItemName(item)} x${count}（灾难材料）`);
        bonusGiven = true;
        break;
      }
    }
    if (!bonusGiven) {
      const bonusItems = ['void_stone', 'crystal', 'herb'];
      const bonusItem = bonusItems[Math.floor(Math.random()*bonusItems.length)];
      const cnt = 1 + Math.floor(Math.random()*2);
      addInventoryItem(bonusItem, cnt);
      lootText.push(`${getItemName(bonusItem)} x${cnt}（灾难奖励）`);
    }

    // Chance for blueprint
    if (Math.random() < 0.20) {
      const bps = ['blueprint_defense_wall','blueprint_watchtower','blueprint_greenhouse','blueprint_water_well','blueprint_traps','blueprint_rogue_den','blueprint_alchemy_lab','blueprint_mage_tower','blueprint_library'];
      const bp = bps[Math.floor(Math.random()*bps.length)];
      if (!G.blueprints.includes(bp)) {
        G.blueprints.push(bp);
        addInventoryItem(bp, 1);
        lootText.push(`${getItemName(bp)} x1（稀有蓝图！）`);
      }
    }
    // Chance for star fragment in late-game disasters
    if (G.day >= 30 && Math.random() < 0.15) {
      addInventoryItem('star_fragment', 1);
      lootText.push('星之碎片 x1（稀有！）');
    }
  }

  addLog(`🏆 战斗胜利！获得：${lootText.join(', ')}（+${exp}EXP）`, 'loot');

  // Random chest drop
  if (Math.random() < 0.2) {
    const chestTier = rollChestTier();
    addInventoryItem('chest_' + chestTier, 1);
    const chestDef = GAME_DATA.gameplay.chest_tiers[chestTier];
    addLog(`📦 获得了${chestDef?.name || '宝箱'}！（在背包中打开）`, 'loot');
  }

  // 钥匙掉落 (15%)
  if (Math.random() < 0.15) {
    const keyPool = ['key_blue','key_blue','key_silver','key_gold'];
    const keyId = keyPool[Math.floor(Math.random()*keyPool.length)];
    addInventoryItem(keyId, 1);
    addLog(`🔑 获得了${getItemName(keyId)}！`, 'loot');
  }

  combatState = null;
  hideCombat();
  checkAchievements();
  renderAll();
}

function generateCombatLoot(enemy) {
  const drops = [];
  const day = G.day;
  // Basic drops
  if (Math.random() < 0.6) drops.push(['meat', 1 + Math.floor(Math.random()*2)]);
  if (Math.random() < 0.4) drops.push(['leather', 1]);
  if (Math.random() < 0.2) drops.push(['feather', 1]);
  if (Math.random() < 0.15) drops.push(['beast_bone', 1]);
  if (enemy.name.includes('虚空') && Math.random() < 0.3) drops.push(['void_stone', 1]);
  if (enemy.name.includes('虚空') && Math.random() < 0.15) drops.push(['void_essence', 1]);

  // Day-scaled rare drops
  if (day >= 15 && Math.random() < 0.08) drops.push(['copper_ore', 1+Math.floor(Math.random()*2)]);
  if (day >= 30 && Math.random() < 0.05) drops.push(['star_fragment', 1]);

  // Disaster material drops
  if (enemy.name.includes('风') || enemy.name.includes('虫')) { if(Math.random()<0.2) drops.push(['wind_essence',1]); }
  if (enemy.name.includes('雷') || enemy.name.includes('电')) { if(Math.random()<0.15) drops.push(['thunder_stone',1]); }
  if (enemy.name.includes('风暴') || enemy.name.includes('潮汐')) { if(Math.random()<0.1) drops.push(['storm_crystal',1]); }
  if (enemy.name.includes('混沌') || enemy.name.includes('巨兽')) { if(Math.random()<0.08) drops.push(['chaos_core',1]); }

  // Profession book drop (5%)
  if (Math.random() < 0.05) {
    const basicProf = ['profession_book_guardian','profession_book_pioneer','profession_book_smith','profession_book_hunter','profession_book_healer','profession_book_rogue','profession_book_priest','profession_book_alchemist','profession_book_berserker'];
    const advProf = ['profession_book_skywalker','profession_book_enchanter','profession_book_commander','profession_book_necromancer','profession_book_ranger'];
    const legendaryProf = ['profession_book_paladin','profession_book_shadow_king'];
    const mythicProf = ['profession_book_void_sovereign'];
    let pool;
    if (day >= 60 && Math.random() < 0.1) pool = [...mythicProf, ...legendaryProf];
    else if (day >= 40 && Math.random() < 0.2) pool = [...legendaryProf, ...advProf];
    else if (day >= 20) pool = [...basicProf, ...advProf];
    else pool = basicProf;
    drops.push([pool[Math.floor(Math.random()*pool.length)], 1]);
  }

  // Skill book drop (3%)
  if (Math.random() < 0.03) {
    const basicSkills = ['skill_book_guardian_1','skill_book_guardian_2','skill_book_pioneer_1','skill_book_pioneer_2','skill_book_smith_1','skill_book_smith_2','skill_book_hunter_1','skill_book_hunter_2','skill_book_healer_1','skill_book_healer_2','skill_book_rogue_1','skill_book_rogue_2','skill_book_priest_1','skill_book_priest_2','skill_book_alchemist_1','skill_book_alchemist_2','skill_book_berserker_1','skill_book_berserker_2','skill_book_universal_1','skill_book_universal_2','skill_book_universal_3','skill_book_universal_4','skill_book_universal_7','skill_book_universal_8'];
    const advSkills = ['skill_book_skywalker_1','skill_book_skywalker_2','skill_book_enchanter_1','skill_book_enchanter_2','skill_book_commander_1','skill_book_commander_2','skill_book_necromancer_1','skill_book_necromancer_2','skill_book_ranger_1','skill_book_ranger_2','skill_book_rogue_3','skill_book_priest_3','skill_book_alchemist_3','skill_book_berserker_3','skill_book_universal_9','skill_book_universal_10'];
    const ultSkills = ['skill_book_guardian_3','skill_book_pioneer_3','skill_book_smith_3','skill_book_hunter_3','skill_book_healer_3','skill_book_skywalker_3','skill_book_enchanter_3','skill_book_commander_3','skill_book_necromancer_3','skill_book_ranger_3','skill_book_rogue_4','skill_book_priest_4','skill_book_alchemist_4','skill_book_berserker_4','skill_book_universal_5','skill_book_universal_6','skill_book_universal_11'];
    const legendarySkills = ['skill_book_paladin_1','skill_book_paladin_2','skill_book_paladin_3','skill_book_paladin_4','skill_book_shadow_king_1','skill_book_shadow_king_2','skill_book_shadow_king_3','skill_book_shadow_king_4'];
    const mythicSkills = ['skill_book_void_sovereign_1','skill_book_void_sovereign_2','skill_book_void_sovereign_3','skill_book_void_sovereign_4'];
    let pool;
    if (day >= 60 && Math.random() < 0.1) pool = [...mythicSkills, ...legendarySkills];
    else if (day >= 45) pool = [...basicSkills, ...advSkills, ...ultSkills, ...legendarySkills.slice(0,2)];
    else if (day >= 20) pool = [...basicSkills, ...advSkills];
    else pool = basicSkills;
    drops.push([pool[Math.floor(Math.random()*pool.length)], 1]);
  }

  return drops;
}

function checkCombatEvent() {
  if (!combatState || Math.random() > 0.2) return;
  const events = GAME_DATA.gameplay.combat_random_events;
  const evt = events[Math.floor(Math.random()*events.length)];
  if (!evt) return;

  switch(evt.id) {
    case 'enemy_reinforce':
      const beast = GAME_DATA.creatures.wild_beasts[Math.floor(Math.random()*GAME_DATA.creatures.wild_beasts.length)];
      if (beast) combatState.enemies.push({...beast, currentHp:beast.hp, maxHp:beast.hp, index:combatState.enemies.length});
      combatState.log.push(`⚠️ ${evt.desc}`);
      break;
    case 'lucky_strike':
      const target = combatState.enemies.find(e=>e.currentHp>0);
      if (target) { target.currentHp = Math.max(0, target.currentHp - 20); combatState.log.push(`✨ ${evt.desc} 造成20额外伤害！`); }
      break;
    case 'loot_drop':
      openChest(rollChestTier());
      combatState.log.push(`📦 ${evt.desc}`);
      break;
    case 'environment_help':
      combatState.tempDefMult = (combatState.tempDefMult||1) + 0.5;
      combatState.log.push(`🌿 ${evt.desc} 防御+50%！`);
      break;
    case 'enemy_flee':
      const flee = combatState.enemies.find(e=>e.currentHp>0);
      if (flee) { flee.currentHp = 0; combatState.log.push(`🏃 ${evt.desc} ${flee.name}逃跑了！`); }
      break;
    case 'critical_moment':
      combatState.guaranteedCrit = true;
      combatState.log.push(`⚡ ${evt.desc} 下次攻击必暴击！`);
      break;
    case 'trigger_trap':
      G.stats.hp -= 10;
      combatState.log.push(`🪤 ${evt.desc} 受到10点伤害！`);
      break;
    case 'airdrop':
      addInventoryItem('bandage', 3);
      addInventoryItem('cooked_meat', 2);
      combatState.log.push(`📦 ${evt.desc} 获得绷带x3、烤肉x2！`);
      break;
    case 'void_whisper':
      G.stats.mental = Math.max(0, G.stats.mental - 15);
      combatState.log.push(`🌀 ${evt.desc} 精神-15！`);
      break;
    case 'earthquake':
      combatState.enemies.forEach(e => { if(e.currentHp>0) e.currentHp -= 5; });
      combatState.log.push(`🌋 ${evt.desc} 所有敌人受到5点伤害！`);
      break;
  }
}
